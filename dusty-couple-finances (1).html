function txModal(id, kind) {
  const existing = id ? S.transactions.find(t => t.id === id) : null;
  if (existing && existing.type === "transfer") return transferModal(id);
  const type = existing ? existing.type : (kind || "expense");
  const isNew = !existing;
  const t = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(), date: today(), payee: "", amount: 0, accountId: null, categoryId: null, memo: "", tags: [],
    cleared: true, reconciled: false, reviewed: true, type, splits: null, checkNo: "", tax: "", attachments: [],
    transferAccountId: null, personId: null, incomeSource: "Check", created: today(),
  };
  const curBucket = type === "expense" ? (t.categoryId ? bucketOf(t.categoryId) : "") : "";
  const body = `
    <div class="row"><label class="f"><span>Date</span><input type="date" id="f-date" value="${t.date}"></label>
      <label class="f"><span>Amount</span><input type="number" step="0.01" id="f-amount" value="${Math.abs(t.amount) || ""}" placeholder="0.00"></label></div>
    ${type === "expense" ? `<label class="f"><span>Category</span><select id="f-cat">
        ${BUCKETS.map(b => `<option value="${b.id}" ${curBucket === b.id ? "selected" : ""}>${b.icon} ${b.label}</option>`).join("")}
      </select>${t.categoryId && !allCats().find(c => c.id === t.categoryId)?.main ? `<span class="muted" style="font-size:11.5px">Currently filed under ${esc(catName(t.categoryId))} — changing this moves it to the main category.</span>` : ""}</label>`
      : `<label class="f"><span>Category</span><select id="f-cat">${INCOME_SOURCES.map(x => `<option ${t.incomeSource === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>`}
    <label class="f"><span>Who</span><select id="f-person">
      <option value="">Joint / household</option>
      ${S.people.map(p => `<option value="${p.id}" ${t.personId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>
    <label class="f"><span>Memo</span><input type="text" id="f-memo" value="${esc(t.memo)}" placeholder="Optional"></label>
    <label class="f"><span>Tags</span><input type="text" id="f-tags" value="${esc((t.tags || []).join(", "))}" placeholder="Optional, comma separated"></label>`;
  const footer = `${existing ? `<button class="btn danger" id="del">Delete</button>` : ""}<span style="flex:1"></span><button class="btn" data-close="1">Cancel</button><button class="btn primary" id="save">${isNew ? "Add " + type : "Save changes"}</button>`;
  modal({
    title: isNew ? (type === "expense" ? "New expense" : "New income") : (type === "expense" ? "Edit expense" : "Edit income"),
    body, footer, onMount: el => {
      const g = s => el.querySelector(s);
      if (existing) g("#del").onclick = () => confirmDialog("Delete transaction", `Remove this ${money(Math.abs(existing.amount))} ${existing.type}?`, () => {
        commit("Delete transaction", () => { S.transactions = S.transactions.filter(x => x.id !== id); });
        closeModal(); toast("Deleted", { label: "Undo", fn: undo });
      }, true);
      g("#save").onclick = () => {
        const amt = Math.abs(Number(g("#f-amount").value) || 0);
        if (!amt) return toast("Enter an amount.");
        const person = g("#f-person").value || null;
        const rec = Object.assign({}, t, {
          date: g("#f-date").value || today(),
          amount: type === "income" ? amt : -amt,
          type,
          personId: person,
          memo: g("#f-memo").value,
          tags: g("#f-tags").value.split(",").map(x => x.trim()).filter(Boolean),
          reviewed: true,
        });
        if (type === "expense") {
          const bucket = g("#f-cat").value;
          const keepDetailed = t.categoryId && bucketOf(t.categoryId) === bucket;
          rec.categoryId = keepDetailed ? t.categoryId : mainCatId(bucket);
          rec.payee = rec.payee || rec.memo || bucketMeta(bucket).label;

          rec.categoryId = null;
          rec.payee = rec.payee || rec.memo || rec.incomeSource;

        commit(isNew ? `Add ${type}` : `Edit ${type}`, () => {
          if (isNew) S.transactions.push(rec);
          else { const i = S.transactions.findIndex(x => x.id === id); S.transactions[i] = rec; }
        });
        closeModal(); toast(isNew ? (type === "expense" ? "Expense added" : "Income added") : "Saved");
      };
    }
  });
}

    }
  });

function importTillerRows(rows, pick, accountId) {
  const c = pick.cols;
  let n = 0;
  rows.forEach(row => {
    if ((row[c.ai] || "").trim() !== pick.name) return;
    if (c.di < 0 || c.mi < 0) return;
    let date = (row[c.di] || "").trim();
    const d = new Date(date); if (!isNaN(d)) date = d.toISOString().slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const amount = round2(Number(String(row[c.mi] || "0").replace(/[^0-9.\-]/g, "")) || 0);
    if (!amount) return;
    const payee = String(row[c.pi] || "Imported").trim();
    const catName = c.ci >= 0 ? String(row[c.ci] || "").trim() : "";
    const cat = catName ? (allCats().find(x => x.name.toLowerCase() === catName.toLowerCase())?.id || null) : null;
    const rec = { id: uid(), date, payee, amount, accountId, categoryId: cat, memo: "", tags: ["tiller"], cleared: true, reconciled: false, reviewed: !!cat, type: amount > 0 ? "income" : "expense", splits: null, checkNo: "", tax: "", attachments: [], transferAccountId: null, personId: null, incomeSource: amount > 0 ? "Check" : undefined, created: today() };
    if (isDup(rec)) return;
    applyRules(rec);
    S.transactions.push(rec); n++;
  });
  return n;
}

      <label class="flexrow" style="justify-content:space-between"><span>Include in dashboard</span><label class="switch"><input type="checkbox" id="a-budget" ${a.onBudget ? "checked" : ""}><i></i></label></label>
      <label class="flexrow" style="justify-content:space-between"><span>Active account</span><label class="switch"><input type="checkbox" id="a-active" ${a.archived ? "" : "checked"}><i></i></label></label>
    </div>
    <label class="f" style="margin-top:10px"><span>Notes</span><textarea id="a-notes" rows="2">${esc(a.notes || "")}</textarea></label>`;
  modal({
    title: ex ? "Edit account" : "Add account", wide: true, body,
    footer: `${ex ? `<button class="btn danger" id="del">Delete</button>${tiller ? "" : `<button class="btn" id="adjust">Update balance</button>`}` : ""}<span style="flex:1"></span>
      <button class="btn" data-close="1">Cancel</button><button class="btn primary" id="save">${ex ? "Save changes" : "Save account"}</button>`,
    onMount: el => {
      const g = s => el.querySelector(s);
      const sync = () => {
        const t = atype(g("#a-type").value);
        g("#grp-bank").style.display = t.cls === "bank" ? "block" : "none";
        g("#grp-credit").style.display = t.cls === "credit" ? "block" : "none";
        g("#grp-loan").style.display = t.cls === "loan" ? "block" : "none";
        g("#grp-payee").style.display = t.cls === "bank" ? "none" : "block";
        g("#wrap-goal").style.display = t.id === "savings" ? "block" : "none";
        if (!ex) g("#a-budget").checked = t.budget;
        calc();
      };
      const calc = () => {
        const owed = Math.abs(Number(g("#a-owed").value) || 0), limit = Number(g("#a-limit").value) || 0;
        g("#calc-avail").textContent = money(Math.max(0, limit - owed));
        g("#calc-util").textContent = limit ? pct(owed / limit, 1) : "—";
        g("#calc-bar").innerHTML = limit ? progressBar(owed / limit, owed / limit > .3 ? "var(--out)" : "var(--in)") : "";
        const bal = Math.abs(Number(g("#a-owed2").value) || 0), pay = Number(g("#a-min2").value) || 0, apr = Number(g("#a-apr2").value) || 0;
        const r = bal && pay ? amortize(bal, apr, pay, 0) : null;
        g("#calc-left").value = r && r.months < 1200 ? `${r.months} months` : "—";
      };
      ["#a-owed", "#a-limit", "#a-owed2", "#a-min2", "#a-apr2"].forEach(s => { const n = g(s); if (n) n.oninput = calc; });
      g("#a-type").onchange = sync;
      sync();
      if (ex) {
        g("#del").onclick = () => confirmDialog("Delete account", `This also deletes ${S.transactions.filter(t => txTouches(t, id)).length} transactions on it.`, () => {
          commit("Delete account", () => { S.accounts = S.accounts.filter(x => x.id !== id); S.transactions = S.transactions.filter(t => !txTouches(t, id)); });
          closeModal(); toast("Account deleted", { label: "Undo", fn: undo });
        }, true);
        if (!tiller) g("#adjust").onclick = () => { closeModal(); adjustModal(id); };
      }
      g("#save").onclick = () => {
        const type = tiller ? a.type : g("#a-type").value, cls = atype(type).cls;
        const bal = cls === "bank" ? (Number(g("#a-start").value) || 0)
          : cls === "credit" ? -Math.abs(Number(g("#a-owed").value) || 0)
            : -Math.abs(Number(g("#a-owed2").value) || 0);
        const rec = Object.assign(a, {
          name: g("#a-name").value.trim() || "Untitled account", type, ownerId: g("#a-owner").value || null,
          startBalance: tiller ? a.startBalance : bal,
          nickname: cls === "loan" ? g("#a-nick2").value : cls === "bank" ? g("#a-nick").value : a.nickname,
          institution: cls === "loan" ? g("#a-lender").value : a.institution,
          savingsGoal: type === "savings" ? Number(g("#a-goal").value) || 0 : 0,
          creditLimit: cls === "credit" ? Number(g("#a-limit").value) || 0 : 0,
          apr: cls === "credit" ? Number(g("#a-apr").value) || 0 : cls === "loan" ? Number(g("#a-apr2").value) || 0 : 0,
          minPayment: cls === "credit" ? Number(g("#a-min").value) || 0 : cls === "loan" ? Number(g("#a-min2").value) || 0 : 0,
          dueDay: cls === "credit" ? Number(g("#a-due").value) || 0 : cls === "loan" ? Number(g("#a-due2").value) || 0 : 0,
          lastPayment: cls === "credit" ? g("#a-lastpay").value : a.lastPayment || "",
          originalBalance: cls === "loan" ? Number(g("#a-orig").value) || 0 : 0,
          term: cls === "loan" ? Number(g("#a-term").value) || 0 : 0,
          opened: cls === "loan" ? g("#a-opened").value : a.opened,
          paymentPayee: cls === "bank" ? "" : g("#a-paypayee").value.trim(),
          lastUpdated: cls === "bank" ? (g("#a-updated").value || today()) : today(),
          notes: g("#a-notes").value, onBudget: g("#a-budget").checked, archived: !g("#a-active").checked,
          source: a.source || "manual",
        });
        commit(ex ? "Edit account" : "Add account", () => { if (ex) { const i = S.accounts.findIndex(x => x.id === id); S.accounts[i] = rec; } else S.accounts.push(rec); });
        closeModal(); toast(ex ? "Account saved" : "Account added");
      };
    }
  });
}
function adjustModal(id) {
  const bal = balanceOf(id);
  modal({
    title: "Balance adjustment", body: `<p class="muted" style="margin-top:0">Dusty Couple Finances says this account holds <b class="num">${money(bal)}</b>. Enter what the bank says and it records the difference as an adjustment.</p>
    <label class="f"><span>Actual balance</span><input type="number" step="0.01" id="adj" value="${bal}"></label>`,
    footer: `<button class="btn" data-close="1">Cancel</button><button class="btn primary" id="ok">Record adjustment</button>`,
    onMount: el => el.querySelector("#ok").onclick = () => {
      const v = Number(el.querySelector("#adj").value) || 0, diff = round2(v - bal);
      if (!diff) { closeModal(); return toast("Already matches."); }
      commit("Balance adjustment", () => S.transactions.push({ id: uid(), date: today(), payee: "Balance adjustment", amount: diff, accountId: id, categoryId: null, memo: "Manual adjustment", tags: ["adjustment"], cleared: true, reconciled: false, reviewed: true, type: diff > 0 ? "income" : "expense", splits: null, checkNo: "", tax: "", attachments: [], transferAccountId: null, created: today() }));
      closeModal(); toast(`Adjusted by ${money(diff, { plus: true })}`);
    }
  });
}
/* ---------- account ledger ---------- */
function ledgerModal(id) {
  const a = acct(id);
  const list = S.transactions.filter(t => txTouches(t, id)).sort((x, y) => y.date.localeCompare(x.date));
  let run = balanceOf(id);
  const rows = list.map(t => { const line = { t, bal: run }; run = round2(run - effect(t, id)); return line; });
  modal({
    title: `${a.name} — ${money(balanceOf(id), { cur: a.currency })}`, wide: true,
    body: `<div class="flexrow" style="margin-bottom:12px">
      <span class="chip">Cleared ${money(clearedBalanceOf(id), { cur: a.currency })}</span>

      ${a.creditLimit ? `<span class="chip">Limit ${money(a.creditLimit, { dp: 0 })}</span>` : ""}${a.apr ? `<span class="chip">${a.apr}% APR</span>` : ""}
      <span style="flex:1"></span><button class="btn sm" data-reconcile="${id}">Reconcile</button><button class="btn sm" data-editaccount="${id}">Edit account</button></div>
      <table><tr><th>Date</th><th>Payee</th><th>Category</th><th>Memo</th><th>C</th><th class="r">Amount</th><th class="r">Balance</th></tr>
      ${rows.map(({ t, bal }) => `<tr class="clickable" data-edittx="${t.id}"><td class="num muted">${fmtDateShort(t.date)}</td><td>${esc(t.payee)}</td>
        <td class="muted">${t.type === "transfer" ? `⇄ ${esc(acct(t.accountId === id ? t.transferAccountId : t.accountId)?.name || "")}` : esc(catName(t.categoryId))}</td>
        <td class="muted">${esc(t.memo || "")}</td><td>${t.reconciled ? "◉" : t.cleared ? "✓" : "○"}</td>
        <td class="r num ${effect(t, id) > 0 ? "pos" : ""}">${money(effect(t, id), { plus: true, cur: a.currency })}</td><td class="r num">${money(bal, { cur: a.currency })}</td></tr>`).join("")}
      </table>${list.length ? "" : `<div class="empty"><b>No activity</b>Nothing recorded on this account yet.</div>`}`,
    footer: `<button class="btn" data-close="1">Close</button>`,
  });
}
/* ---------- reconcile ---------- */
function reconcileModal(id) {
  const a = acct(id);
  modal({
    title: `Reconcile ${a.name}`, wide: true,
    body: `<div class="row"><label class="f"><span>Statement date</span><input type="date" id="r-date" value="${today()}"></label>
      <label class="f"><span>Statement ending balance</span><input type="number" step="0.01" id="r-bal" value="${clearedBalanceOf(id)}"></label></div>
      <div class="panel" style="box-shadow:none;margin-bottom:14px"><div class="panel-b">
        <div class="flexrow" style="justify-content:space-between"><span class="muted">Cleared in Dusty Couple Finances</span><b class="num" id="r-cleared">${money(clearedBalanceOf(id))}</b></div>
        <div class="flexrow" style="justify-content:space-between"><span class="muted">Statement</span><b class="num" id="r-stmt">${money(clearedBalanceOf(id))}</b></div>
        <div class="hairline"></div>
        <div class="flexrow" style="justify-content:space-between"><b>Difference</b><b class="num" id="r-diff" style="font-size:18px">${money(0)}</b></div>
      </div></div>
      <span class="eyebrow">Tick off what appears on the statement</span>
      <div style="max-height:34vh;overflow:auto;margin-top:6px"><table>
      ${S.transactions.filter(t => txTouches(t, id) && !t.reconciled).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 200).map(t => `<tr><td style="width:26px"><input type="checkbox" data-rc="${t.id}" ${t.cleared ? "checked" : ""}></td>
        <td class="num muted">${fmtDateShort(t.date)}</td><td>${esc(t.payee)}</td><td class="r num">${money(effect(t, id), { plus: true })}</td></tr>`).join("")}
      </table></div>
      <label class="f" style="margin-top:12px"><span>Note</span><input type="text" id="r-note" placeholder="August statement"></label>`,
    footer: `<button class="btn" data-close="1">Cancel</button><button class="btn primary" id="finish">Finish reconciliation</button>`,
    onMount: el => {
      const recalc = () => {
        let b = a.startBalance || 0;
        S.transactions.forEach(t => {
          const box = el.querySelector(`[data-rc="${t.id}"]`);
          const on = box ? box.checked : t.reconciled || t.cleared;
          if (on) b += effect(t, id);
        });
        const stmt = Number(el.querySelector("#r-bal").value) || 0;
        el.querySelector("#r-cleared").textContent = money(b);
        el.querySelector("#r-stmt").textContent = money(stmt);
        const d = round2(stmt - b);
        const de = el.querySelector("#r-diff");
        de.textContent = money(d); de.className = "num " + (Math.abs(d) < .005 ? "pos" : "neg");
        return { b, stmt, d };
      };
      el.querySelectorAll("[data-rc]").forEach(c => c.onchange = recalc);
      el.querySelector("#r-bal").oninput = recalc;
      recalc();
      el.querySelector("#finish").onclick = () => {
        const { stmt, d } = recalc();
        commit("Reconcile account", () => {
          el.querySelectorAll("[data-rc]").forEach(box => {
            const t = S.transactions.find(x => x.id === box.dataset.rc);
            if (!t) return;
            t.cleared = box.checked;
            if (box.checked && Math.abs(d) < .005) t.reconciled = true;
          });
          S.reconciliations.unshift({ id: uid(), accountId: id, date: el.querySelector("#r-date").value, statementBalance: stmt, difference: d, note: el.querySelector("#r-note").value });
        });
        closeModal();
        toast(Math.abs(d) < .005 ? "Reconciled — difference is zero" : `Saved with a ${money(d)} difference to chase`);
      };
    }
  });
}

/* ============================================================
   IMPORT WIZARD (CSV / OFX / QFX / QIF)
   ============================================================ */
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === "\t") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
function parseOFX(text) {
  const out = [];
  const blocks = text.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(b => {
    const get = tag => { const m = b.match(new RegExp("<" + tag + ">([^<\\r\\n]*)", "i")); return m ? m[1].trim() : ""; };
    const raw = get("DTPOSTED").slice(0, 8);
    if (!raw) return;
    out.push({
      date: `${raw.slice(0, 4)}-${raw.slice(4, 6)}-${raw.slice(6, 8)}`,
      payee: get("NAME") || get("MEMO") || "Imported",
      amount: Number(get("TRNAMT")) || 0, memo: get("MEMO"), fitid: get("FITID"),
    });
  });
  return out;
}
function parseQIF(text) {
  const out = []; let cur = {};
  text.split(/\r?\n/).forEach(line => {
    const k = line[0], v = line.slice(1).trim();
    if (k === "^") { if (cur.date) out.push(cur); cur = {}; }
    else if (k === "D") { const p = v.replace(/'/g, "/").split(/[\/\-]/); if (p.length === 3) { let y = p[2].length === 2 ? "20" + p[2] : p[2]; cur.date = `${y}-${String(p[0]).padStart(2, "0")}-${String(p[1]).padStart(2, "0")}`; } }
    else if (k === "T" || k === "U") cur.amount = Number(v.replace(/,/g, "")) || 0;
    else if (k === "P") cur.payee = v;
    else if (k === "M") cur.memo = v;
    else if (k === "L") cur.category = v;
  });
  if (cur.date) out.push(cur);
  return out;
}
function isDup(rec) {
  return S.transactions.some(t => t.accountId === rec.accountId && Math.abs(t.amount - rec.amount) < 0.005 &&
    Math.abs(daysBetween(t.date, rec.date)) <= 3 && t.payee.trim().toLowerCase().slice(0, 12) === rec.payee.trim().toLowerCase().slice(0, 12));
}
function importModal() {

  modal({

    body: `<label class="f"><span>File — CSV, OFX, QFX, or QIF</span><input type="file" id="imp-file" accept=".csv,.txt,.ofx,.qfx,.qif,.tsv" style="border:0;padding:0"></label>
      <label class="f"><span>Into account</span><select id="imp-acct">${acctOptions()}</select></label>
      <div id="imp-body"></div>`,

          <label class="flexrow"><input type="checkbox" id="imp-dup" checked style="width:auto"> Skip likely duplicates</label>

        el.querySelectorAll("[data-map]").forEach(s => s.onchange = e => { mapping[e.target.dataset.map] = Number(e.target.value); prev(); });
        prev();
        q("#imp-go").disabled = false;
      };
      const buildRows = () => {
        const accountId = q("#imp-acct").value;
        const flip = q("#imp-flip")?.checked;
        return (kind === "csv" ? parsed : parsed).map(row => {
          let date, payee, amount, memo, category;

            amount = Number(String(row[mapping.amount] || "0").replace(/[^0-9.\-]/g, "")) || 0;
            memo = mapping.memo >= 0 ? row[mapping.memo] : ""; category = mapping.category >= 0 ? row[mapping.category] : "";
            const d = new Date(date); if (!isNaN(d)) date = d.toISOString().slice(0, 10);

        }).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date));
      };
      const prev = () => {
        const rows = buildRows();
        const dups = rows.filter(isDup).length;
        q("#imp-prev").innerHTML = `<span class="eyebrow">Preview</span><table><tr><th>Date</th><th>Payee</th><th>Category</th><th class="r">Amount</th></tr>
          ${rows.slice(0, 8).map(r => `<tr><td class="num">${r.date}</td><td>${esc(r.payee)}</td><td class="muted">${esc(catName(r.categoryId) || "—")}</td><td class="r num ${r.amount > 0 ? "pos" : ""}">${money(r.amount, { plus: true })}</td></tr>`).join("")}</table>
          <p class="muted">${rows.length} ready · ${dups} look like duplicates.</p>`;
      };
      q("#imp-acct").onchange = () => { if (kind === "csv" && header.length) prev(); };
      q("#imp-go").onclick = () => {
        const rows = buildRows();
        const skipDup = q("#imp-dup") ? q("#imp-dup").checked : true;
        const useRules = q("#imp-rules") ? q("#imp-rules").checked : true;
        let added = 0, skipped = 0;
        commit("Import transactions", () => {
          rows.forEach(r => {
            if (skipDup && isDup(r)) { skipped++; return; }

          });
        });
        closeModal();
        toast(`${added} imported${skipped ? `, ${skipped} duplicates skipped` : ""}`, { label: "Undo", fn: undo });
      };
    }

function download(name, content, mime = "text/plain") {

  const url = URL.createObjectURL(blob);

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const csvEsc = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function toCSV(rows) { return rows.map(r => r.map(csvEsc).join(",")).join("\n"); }

  return toCSV([["Date", "Payee", "Amount", "Account", "Category", "Group", "Memo", "Tags", "Type", "Cleared", "Reconciled", "Check", "Tax", "Transfer to"],
  ...list.map(t => [t.date, t.payee, t.amount, acct(t.accountId)?.name || "", catName(t.categoryId), groupOf(t.categoryId), t.memo, (t.tags || []).join(" "), t.type, t.cleared ? "y" : "n", t.reconciled ? "y" : "n", t.checkNo || "", t.tax || "", acct(t.transferAccountId)?.name || ""])]);
}

  if (kind === "budgets") { const rows = [["Month", "Group", "Category", "Assigned", "Spent", "Available"]]; Object.keys(S.budgets).sort().forEach(m => { const b = budgetMonth(m); b.rows.forEach(r => { if (r.budgeted || r.spent) rows.push([m, r.groupName, r.name, r.budgeted, r.spent, r.available]); }); }); return download(`Budgets_${stamp}.csv`, toCSV(rows), "text/csv"); }

      ["Accounts.csv", null], ["Transactions.csv", txCSV(S.transactions)], ["Categories.csv", toCSV([["Group", "Category", "Rollover"], ...allCats().map(c => [c.groupName, c.name, c.rollover])])],
    ];

    const rows = [["Month", "Category", "Assigned", "Spent", "Available"]];
    Object.keys(S.budgets).sort().forEach(m => budgetMonth(m).rows.forEach(r => { if (r.budgeted || r.spent) rows.push([m, r.name, r.budgeted, r.spent, r.available]); }));
    bundle += `\n\n===== Budgets.csv =====\n${toCSV(rows)}`;
    bundle += `\n\n===== Goals.csv =====\n${toCSV([["Name", "Kind", "Target", "Saved"], ...S.goals.map(g => [g.name, g.kind, g.target, g.saved])])}`;
    bundle += `\n\n===== Recurring.csv =====\n${toCSV([["Payee", "Amount", "Frequency", "Next"], ...S.recurring.map(r => [r.payee, r.amount, r.freq, r.next])])}`;
    bundle += `\n\n===== Backup.json =====\n${JSON.stringify(S)}`;
    download(`DustyCoupleFinances_everything_${stamp}.txt`, bundle);
    download(`DustyCoupleFinances_backup_${stamp}.json`, JSON.stringify(S, null, 2), "application/json");
    return;
  }
}
function restoreFromFile() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(String(r.result));
        if (!data.accounts || !data.transactions) throw new Error("bad file");
        confirmDialog("Restore backup", `This replaces everything with the backup from ${data.meta?.lastSaved ? new Date(data.meta.lastSaved).toLocaleString() : "an unknown date"}.`, () => {
          snapshot("Restore backup"); S = Object.assign(blankState(), data); save(); toast("Backup restored", { label: "Undo", fn: undo });
        }, true);
      } catch (e) { toast("That file isn't a Dusty Couple Finances backup."); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function dailySnapshot() {
  const key = KEY + ".backups";
  let list = [];
  try { list = JSON.parse(store.get(key) || "[]"); } catch (e) { }
  const last = list[0];
  if (last && last.ts.slice(0, 10) === today()) return;
  const data = JSON.stringify(S);
  list.unshift({ ts: new Date().toISOString(), size: data.length, data });
  list = list.slice(0, 5);
  try { store.set(key, JSON.stringify(list)); } catch (e) { }
}

function bulkModal(kind) {

    memo: { title: "Set memo", input: `<input type="text" id="v">`, apply: v => t => t.memo = v },
  }[kind];
  if (!fields) return;

    onMount: el => el.querySelector("#ok").onclick = () => {

    }

function integrityCheck() {
  const out = [];
  S.accounts.forEach(a => {
    const calc = balanceOf(a.id);
    const recompute = round2((a.startBalance || 0) + sum(S.transactions.map(t => effect(t, a.id))));
    if (Math.abs(calc - recompute) > 0.005) out.push(["error", `${a.name}: balance mismatch (${money(calc)} vs ${money(recompute)})`]);
  });
  const orphan = S.transactions.filter(t => t.categoryId && !catById(t.categoryId));
  if (orphan.length) out.push(["warn", `${orphan.length} transactions point at a deleted category`]);
  const noAcct = S.transactions.filter(t => !acct(t.accountId));
  if (noAcct.length) out.push(["error", `${noAcct.length} transactions have no account`]);
  const badTransfer = S.transactions.filter(t => t.type === "transfer" && (!acct(t.transferAccountId) || t.transferAccountId === t.accountId));
  if (badTransfer.length) out.push(["error", `${badTransfer.length} transfers point nowhere`]);
  const seen = {}, dups = [];
  S.transactions.forEach(t => { const k = [t.accountId, t.date, t.amount, t.payee.toLowerCase()].join("|"); if (seen[k]) dups.push(t); else seen[k] = 1; });
  if (dups.length) out.push(["warn", `${dups.length} possible duplicate transactions`]);
  const splitBad = S.transactions.filter(t => t.splits && t.splits.length && Math.abs(sum(t.splits.map(s => s.amount)) - t.amount) > 0.02);
  if (splitBad.length) out.push(["warn", `${splitBad.length} splits don't add up to their transaction total`]);
  const over = Object.keys(S.budgets).length;
  const el = $("#integrityOut");
  el.innerHTML = out.length
    ? `<table>${out.map(([lvl, msg]) => `<tr><td style="width:80px"><span class="badge ${lvl === "error" ? "r" : "b"}">${lvl}</span></td><td>${esc(msg)}</td></tr>`).join("")}</table>
       <div class="flexrow" style="margin-top:10px"><button class="btn sm" data-fixorphans="1">Reassign orphans to Uncategorized</button></div>`
    : `<p class="pos" style="margin:0">All checks pass. ${S.transactions.length} transactions across ${S.accounts.length} accounts, ${over} budgeted months, and every balance ties out.</p>`;
}

  if (d.set !== undefined) { commit("Change setting", () => S.settings[d.set] = t.type === "checkbox" ? t.checked : t.type === "number" ? Number(t.value) : t.value); if (d.set === "theme") applyTheme(); return; }
  if (d.alert !== undefined) { commit("Change alert", () => S.settings.alerts[d.alert] = t.type === "checkbox" ? t.checked : Number(t.value)); return; }
  if (d.rate !== undefined) { commit("Change exchange rate", () => S.settings.rates[d.rate] = Number(t.value) || 1); return; }
  if (d.custom !== undefined) { UI[d.custom === "row" ? "customRow" : "customCol"] = t.value; return render(); }
  if (t.id === "debtExtra") { UI.debtExtra = Number(t.value) || 0; return render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "txq") {
    UI.txFilters.q = e.target.value; UI.txPage = 0;
    clearTimeout(window.__q);
    window.__q = setTimeout(() => { const pos = e.target.selectionStart; render(); const box = $("#txq"); if (box) { box.focus(); box.setSelectionRange(pos, pos); } }, 220);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modalStack.length) return closeModal();
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "e") { e.preventDefault(); return exportData("json"); }
  if (typing || modalStack.length) return;
  if (e.key === "n") { e.preventDefault(); return txChooser(); }
  if (e.key === "t") { e.preventDefault(); return transferModal(null); }
  if (e.key === "d") { commit("Toggle theme", () => S.settings.theme = S.settings.theme === "dark" ? "light" : "dark"); return applyTheme(); }
  if (e.key === "/") { e.preventDefault(); go("transactions"); return setTimeout(() => $("#txq")?.focus(), 60); }
  const v = VIEWS.find(x => x.key === e.key);
  if (v) return go(v.id);
});

/* ---------- extra helpers used by events ---------- */
function txMenu(id) {
  const t = S.transactions.find(x => x.id === id);
  modal({
    title: t.payee, body: `<div class="stack" style="gap:6px">
      ${[["Edit", "edit"], ["Duplicate", "dup"], ["Create a rule from this payee", "rule"], ["Mark cleared", "clear"], ["Mark reconciled", "rec"], ["Delete", "del"]].map(([l, k]) => `<button class="btn" data-mi="${k}" style="justify-content:flex-start">${l}</button>`).join("")}
    </div>`, footer: null,
    onMount: el => el.querySelectorAll("[data-mi]").forEach(b => b.onclick = () => {
      const k = b.dataset.mi; closeModal();
      if (k === "edit") return txModal(id);
      if (k === "dup") { const c = JSON.parse(JSON.stringify(t)); c.id = uid(); commit("Duplicate transaction", () => S.transactions.push(c)); return toast("Duplicated"); }
      if (k === "rule") return ruleModal(null, { field: "payee", op: "contains", value: t.payee });
      if (k === "clear") return commit("Mark cleared", () => t.cleared = true);
      if (k === "rec") return commit("Mark reconciled", () => { t.cleared = true; t.reconciled = true; });
      if (k === "del") return confirmDialog("Delete transaction", `Remove ${t.payee} for ${money(t.amount)}?`, () => { commit("Delete transaction", () => S.transactions = S.transactions.filter(x => x.id !== id)); toast("Deleted", { label: "Undo", fn: undo }); }, true);
    })
  });
}
function coverModal(catId) {
  const b = budgetMonth(UI.month);
  const row = b.rows.find(r => r.id === catId);
  const donors = b.rows.filter(r => r.available > 0).sort((a, c) => c.available - a.available);
  modal({
    title: `Cover ${row.name}`,
    body: `<p class="muted" style="margin-top:0">${row.name} is over by <b class="num neg">${money(-row.available)}</b>. Move money from a category with room.</p>
      <label class="f"><span>Take it from</span><select id="from">${donors.map(d => `<option value="${d.id}">${esc(d.name)} — ${money(d.available)} available</option>`).join("")}</select></label>
      <label class="f"><span>Amount</span><input type="number" step="0.01" id="amt" value="${-row.available}"></label>`,
    footer: `<button class="btn" data-close="1">Cancel</button><button class="btn primary" id="ok">Move the money</button>`,
    onMount: el => el.querySelector("#ok").onclick = () => {
      const from = el.querySelector("#from").value, amt = Number(el.querySelector("#amt").value) || 0;
      if (!from || !amt) return closeModal();
      commit("Cover overspending", () => {
        const bm = S.budgets[UI.month] = S.budgets[UI.month] || {};
        bm[from] = round2((bm[from] || 0) - amt);
        bm[catId] = round2((bm[catId] || 0) + amt);
      });
      closeModal(); toast(`${money(amt)} moved into ${row.name}`);
    }
  });
}
function autoBudget() {
  const b = budgetMonth(UI.month);
  const prev3 = [1, 2, 3].map(i => catSpendMap(addMonths(UI.month, -i)));
  modal({
    title: "Auto-assign", body: `<p style="margin-top:0">Fill this month's plan from your own history. You can edit anything afterwards.</p>
      <div class="stack" style="gap:8px">
      <button class="btn" data-ab="avg" style="justify-content:flex-start">Average of the last three months</button>
      <button class="btn" data-ab="last" style="justify-content:flex-start">Copy last month's assignments</button>
      <button class="btn" data-ab="spent" style="justify-content:flex-start">Match last month's actual spending</button>
      <button class="btn" data-ab="zero" style="justify-content:flex-start">Clear everything back to zero</button></div>`, footer: null,
    onMount: el => el.querySelectorAll("[data-ab]").forEach(btn => btn.onclick = () => {
      const k = btn.dataset.ab;
      commit("Auto-assign budget", () => {
        const target = S.budgets[UI.month] = {};
        if (k === "avg") allCats().forEach(c => { const v = round2(sum(prev3.map(p => p[c.id] || 0)) / 3); if (v > 0) target[c.id] = v; });
        if (k === "last") Object.assign(target, S.budgets[addMonths(UI.month, -1)] || {});
        if (k === "spent") { const s = prev3[0]; for (const k2 in s) if (s[k2] > 0) target[k2] = round2(s[k2]); }
      });
      closeModal(); toast(k === "zero" ? "Plan cleared" : "Plan filled in");
    })
  });
}
function applyTheme() { document.documentElement.dataset.theme = S.settings.theme === "dark" ? "dark" : "light"; }

/* ============================================================
   LOCK SCREEN + BOOT
   ============================================================ */
function lockScreen(onOpen) {
  const el = document.createElement("div");
  el.id = "lockscreen";
  el.innerHTML = `<div style="text-align:center;max-width:280px">
    <div style="width:44px;height:44px;border-radius:10px;background:var(--ink);margin:0 auto 16px;position:relative">
      <span style="position:absolute;left:9px;right:9px;top:14px;height:3px;background:var(--brass)"></span>
      <span style="position:absolute;left:9px;right:18px;top:25px;height:3px;background:var(--brass)"></span></div>
    <h1 style="margin-bottom:6px;font-size:19px">Dusty Couple Finances</h1>
    <p class="muted" style="margin-top:0">Enter your PIN to open the books.</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="8" style="text-align:center;font-family:var(--mono);font-size:22px;letter-spacing:.3em">
    <div id="pinErr" class="neg" style="height:20px;font-size:12.5px;margin-top:6px"></div>
    <button class="btn primary" id="pinGo" style="width:100%;justify-content:center">Open</button></div>`;
  document.body.appendChild(el);
  const check = () => {
    const v = el.querySelector("#pinInput").value;
    if (hash(v) === S.settings.pinHash) { el.remove(); onOpen(); }
    else { el.querySelector("#pinErr").textContent = "That PIN doesn't match."; el.querySelector("#pinInput").value = ""; }
  };
  el.querySelector("#pinGo").onclick = check;
  el.querySelector("#pinInput").onkeydown = e => { if (e.key === "Enter") check(); };
  setTimeout(() => el.querySelector("#pinInput").focus(), 60);
}
function autoEnterRecurring() {
  const due = S.recurring.filter(r => r.active !== false && r.auto && r.next <= today());
  if (!due.length) return;
  due.forEach(r => {
    S.transactions.push({ id: uid(), date: r.next, payee: r.payee, amount: r.amount, accountId: r.accountId, categoryId: r.categoryId, memo: r.memo || "", tags: ["recurring"], cleared: false, reconciled: false, reviewed: true, type: r.amount > 0 ? "income" : "expense", splits: null, checkNo: "", tax: "", attachments: [], transferAccountId: null, created: today() });
    r.next = nextOccurrence(r.next, r.freq);
  });
  save(true);
  setTimeout(() => toast(`${due.length} recurring transaction${due.length > 1 ? "s" : ""} entered automatically`), 600);
}
function firstRun() {
  modal({
    title: "Welcome to Dusty Couple Finances", wide: false,
    body: `<p style="margin-top:0">Everything you enter stays on this laptop, in this browser profile. No account, no sync, no network calls.</p>
      <p class="muted">Start from a worked example, or begin with an empty set of books.</p>`,
    footer: `<span style="flex:1"></span><button class="btn" id="empty">Start empty</button><button class="btn primary" id="demo">Explore sample data</button>`,
    onMount: el => {
      el.querySelector("#demo").onclick = () => { S = demoState(); save(); closeModal(); toast("Sample household loaded — swap in your own accounts whenever you like"); };
      el.querySelector("#empty").onclick = () => { closeModal(); accountModal(null); };
    }
  });
}
function boot() {
  const had = load();
  applyTheme();
  const start = () => {
    render();
    if (!had) firstRun();
    else { autoEnterRecurring(); dailySnapshot(); }
    const el = $("#saveStamp");
    if (el && S.meta.lastSaved) el.textContent = "saved " + new Date(S.meta.lastSaved).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  if (had && S.settings.pinHash) lockScreen(start); else start();
  let idle = null;
  const resetIdle = () => {
    clearTimeout(idle);
    const mins = Number(S.settings.autoLockMin) || 0;
    if (!mins || !S.settings.pinHash) return;
    idle = setTimeout(() => { closeAllModals(); lockScreen(render); }, mins * 60000);
  };
  ["mousemove", "keydown", "click"].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));
  resetIdle();
  window.addEventListener("beforeunload", () => { store.set(KEY, JSON.stringify(S)); });
}
boot();
</script></body></html>
