<style>
:root{
  --ink:#0A1428; --ink-2:#2C4160; --ink-3:#68809E;
  --paper:#F2F4F7; --panel:#FFFFFF; --panel-2:#F8FAFC;
  --rule:#DCE3EC; --rule-2:#EDF1F6;
  --brass:#E85B04; --brass-soft:#FFEFE2;
  --blue:#0B3FBF; --blue-2:#1E63E8; --blue-soft:#E6EDFD;
  --in:#0E7C6B; --in-soft:#E3F2EF;
  --out:#B0453B; --out-soft:#FBEAE8;
  --warn:#8A6100; --warn-soft:#FBF1DA;
  --sel:#E6EDFD;
  --shadow:0 1px 2px rgba(15,29,43,.06),0 8px 24px -12px rgba(15,29,43,.18);
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;
  --r:8px;
}
html[data-theme="dark"]{
  --ink:#E8EEF5; --ink-2:#AEC0D2; --ink-3:#7B90A6;
  --paper:#050C1C; --panel:#0C1730; --panel-2:#122040;
  --rule:#22345C; --rule-2:#182746;
  --brass:#FF7A29; --brass-soft:#33200F;
  --blue:#5B8DF6; --blue-2:#3D74EE; --blue-soft:#131F3A;
  --in:#4CC3AB; --in-soft:#0F2A28;
  --out:#E5796C; --out-soft:#2E1917;
  --warn:#E0B458; --warn-soft:#2B2412;
  --sel:#16264A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}
a{color:var(--brass)}
.pos{color:var(--in)}.neg{color:var(--out)}.muted{color:var(--ink-3)}.warnc{color:var(--warn)}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:216px 1fr;height:100vh;overflow:hidden}

.brand b{font-size:13.5px;letter-spacing:-.02em;display:block;line-height:1.15}
.brand span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
#sidebar .toggle{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);margin:8px;padding:7px 9px;border:1px solid var(--rule);background:var(--panel-2);border-radius:var(--r);cursor:pointer;color:var(--ink-2);font-size:13.5px}
#sidebar .toggle:hover{border-color:var(--blue);color:var(--blue)}
#sidebar .toggle .ic{font-size:15px;line-height:1}
.navitem .ic{width:20px;text-align:center;font-size:15px;flex:none;filter:none}
.tipwrap{position:relative}
.tipwrap .tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%) scale(.96);white-space:nowrap;background:var(--ink);color:#fff;padding:5px 9px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;z-index:60;box-shadow:var(--shadow)}
.tipwrap .tip:before{content:"";position:absolute;left:-4px;top:50%;margin-top:-4px;border:4px solid transparent;border-right-color:var(--ink)}
.tipwrap:hover .tip{opacity:1;transform:translateY(-50%) scale(1)}
#app.collapsed{grid-template-columns:62px 1fr}
#app.collapsed .brand{justify-content:center;padding:10px 6px}
#app.collapsed .brand .txt,#app.collapsed .navitem .lbl,#app.collapsed .navitem .kbd,#app.collapsed .navgroup,#app.collapsed .toggle .lbl,#app.collapsed #saveStamp{display:none}
#app.collapsed .navitem{justify-content:center;padding:9px 0}
#app.collapsed .toggle{justify-content:center;width:calc(100% - 12px);margin:8px 6px}
#app:not(.collapsed) .tipwrap .tip{display:none}
#sidebar .foot{margin-top:auto;padding:10px;border-top:1px solid var(--rule-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.navgroup{padding:12px 10px 2px}
nav{padding:4px 8px 16px}
.navitem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink-2);font-size:13.5px}
.navitem:hover{background:var(--panel-2);color:var(--ink)}
.navitem.active{background:var(--sel);color:var(--blue);font-weight:600;box-shadow:inset 2px 0 0 var(--brass)}
.navitem .ic{width:16px;text-align:center;font-size:13px;opacity:.85;flex:none}
.navitem .kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
#main{overflow-y:auto;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:12px 24px;display:flex;gap:12px;align-items:center}
.topbar .spacer{flex:1}
.view{padding:22px 24px 80px;max-width:1360px}

/* ---------- controls ---------- */
.btn{border:1px solid var(--rule);background:var(--panel);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{opacity:.9}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brass);outline:none}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--rule);font-size:11.5px;color:var(--ink-2)}
.chip.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel);color:var(--ink);font-weight:600}
.switch{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--rule);border-radius:999px;transition:.15s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:var(--panel);border-radius:50%;transition:.15s}
.switch input:checked + i{background:var(--in)}
.switch input:checked + i:before{transform:translateX(15px)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow)}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:10px}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- snapshot (signature) ---------- */
.snap{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.snap-hero{display:flex;gap:28px;align-items:flex-end;padding:26px 26px 20px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.snap-hero .big{font-family:var(--mono);font-size:clamp(34px,5vw,54px);font-weight:600;letter-spacing:-.04em;line-height:1}
.snap-hero .spark{flex:1;min-width:200px}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.rail .cell{padding:13px 18px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);position:relative}
.rail .cell:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:2px;background:var(--rule);border-radius:2px}
.rail .cell.k:before{background:var(--brass)}
.rail .cell.b:before{background:var(--blue)}
.rail .cell.i:before{background:var(--in)}
.rail .cell.o:before{background:var(--out)}
.rail .cell v{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.03em;margin-top:3px}
@media(max-width:900px){.rail{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.rail{grid-template-columns:1fr}}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:2;user-select:none}
th.sortable{cursor:pointer}
td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tr.clickable:hover td{background:var(--panel-2)}
tr.sel td{background:var(--sel)}
td.r,th.r{text-align:right}
.tblwrap{max-height:none;overflow:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:3px}
.hairline{height:1px;background:var(--rule-2);margin:14px 0}
.empty{padding:34px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,17,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);width:100%;max-width:560px;animation:pop .14s ease-out}
.modal.wide{max-width:920px}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px;max-height:66vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--rule-2);display:flex;gap:8px;justify-content:flex-end;align-items:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:0;color:var(--brass);font-weight:700;cursor:pointer}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--rule-2);border-top:1px solid var(--rule-2)}
.cal .hd{padding:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);text-align:center}
.cal .day{min-height:92px;padding:5px 6px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);font-size:11.5px}

<script>
/* ============================================================
   DUSTY COUPLE FINANCES — local-first budgeting app
   All data lives in this browser profile on this machine.
   ============================================================ */
"use strict";

/* ---------- storage ---------- */
const KEY = "ledgerrail.v1";
const mem = {};
const store = {
  ok: (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } })(),
  get(k) { return this.ok ? localStorage.getItem(k) : (mem[k] ?? null); },
  set(k, v) { try { this.ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { toast("Storage full — export a backup and trim attachments."); } },
};

/* ---------- small utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

const CURSYM = { USD: "$", CAD: "C$", EUR: "€", GBP: "£", MXN: "MX$", AUD: "A$", JPY: "¥", INR: "₹" };
function money(n, opt = {}) {
  const c = opt.cur || S.settings.currency;
  const sym = CURSYM[c] || (c + " ");
  const v = Math.abs(round2(n || 0));
  const s = v.toLocaleString(undefined, { minimumFractionDigits: opt.dp ?? 2, maximumFractionDigits: opt.dp ?? 2 });
  return (n < -0.004 ? "-" : (opt.plus && n > 0 ? "+" : "")) + sym + s;
}
const mshort = n => money(n, { dp: Math.abs(n) >= 10000 ? 0 : 2 });
const pct = (n, d = 0) => (isFinite(n) ? (n * 100).toFixed(d) : "0") + "%";

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const ym = d => String(d).slice(0, 7);
const ymNow = () => today().slice(0, 7);
function addMonths(m, n) { const [y, mo] = m.split("-").map(Number); const d = new Date(Date.UTC(y, mo - 1 + n, 1)); return d.toISOString().slice(0, 7); }
function addDays(d, n) { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5); }
function monthName(m) { const [y, mo] = m.split("-").map(Number); return new Date(Date.UTC(y, mo - 1, 1)).toLocaleString(undefined, { month: "long", year: "numeric", timeZone: "UTC" }); }
function monthShort(m) { const [y, mo] = m.split("-").map(Number); return new Date(Date.UTC(y, mo - 1, 1)).toLocaleString(undefined, { month: "short", timeZone: "UTC" }); }
function fmtDate(d) { if (!d) return ""; return new Date(d + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }); }
function fmtDateShort(d) { return new Date(d + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" }); }
function endOfMonth(m) { const [y, mo] = m.split("-").map(Number); return new Date(Date.UTC(y, mo, 0)).toISOString().slice(0, 10); }
function daysInMonth(m) { return Number(endOfMonth(m).slice(8)); }

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
}
function hexToHsl(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
  if (!m) return { h: 210, s: 68, l: 48 };
  let [r, g, b] = m.slice(1).map(x => parseInt(x, 16) / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? 60 * (((g - b) / d) % 6) : mx === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
  if (h < 0) h += 360;
  const l = (mx + mn) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}
/** next colour that isn't already taken, spaced around the wheel */
function pickFreeColor() {
  const used = S.people.map(p => hexToHsl(p.color).h);
  for (const h of [212, 275, 22, 160, 330, 45, 190, 300]) if (!used.some(u => Math.abs(u - h) < 25)) return hslToHex(h, 68, 48);
  return hslToHex(Math.floor(Math.random() * 360), 68, 48);
}
const personColor = id => S.people.find(p => p.id === id)?.color || "var(--ink-3)";

function toast(msg, action) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  $("#toast").appendChild(el);
  setTimeout(() => el.remove(), action ? 8000 : 3200);
}

const atype = id => ACCOUNT_TYPES.find(t => t.id === id) || ACCOUNT_TYPES[0];
const acctClass = a => atype(a.type).cls;
const isLiability = a => ["credit", "loan"].includes(acctClass(a));
const isCredit = a => acctClass(a) === "credit";

const isBank = a => acctClass(a) === "bank";

/* ---------- state + persistence + undo ---------- */
let S = blankState();
let undoStack = [], redoStack = [];
const HIST_MAX = 40;

function load() {
  const raw = store.get(KEY);
  if (raw) { try { S = Object.assign(blankState(), JSON.parse(raw)); return true; } catch (e) { console.error(e); } }
  return false;
}
let saveTimer = null;
function save(quiet) {
  S.meta.lastSaved = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    store.set(KEY, JSON.stringify(S));
    const el = $("#saveStamp"); if (el) el.textContent = "saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }, 120);
  if (!quiet) render();
}
function snapshot(label) {
  undoStack.push({ label, data: JSON.stringify(S) });
  if (undoStack.length > HIST_MAX) undoStack.shift();
  redoStack = [];
}
function commit(label, fn) {
  snapshot(label);
  fn();
  logAudit(label);
  save();
}
function undo() {
  if (!undoStack.length) return toast("Nothing to undo");
  const e = undoStack.pop();
  redoStack.push({ label: e.label, data: JSON.stringify(S) });
  S = JSON.parse(e.data); save(); toast("Undid: " + e.label);
}
function redo() {
  if (!redoStack.length) return toast("Nothing to redo");
  const e = redoStack.pop();
  undoStack.push({ label: e.label, data: JSON.stringify(S) });
  S = JSON.parse(e.data); save(); toast("Redid: " + e.label);
}
function logAudit(action, detail = "") {
  S.audit.unshift({ id: uid(), ts: new Date().toISOString(), action, detail });
  if (S.audit.length > 500) S.audit.length = 500;
}

/* ============================================================
   DERIVED DATA / CALCULATION ENGINE
   ============================================================ */
const acct = id => S.accounts.find(a => a.id === id);
const allCats = () => S.groups.flatMap(g => g.cats.map(c => ({ ...c, groupId: g.id, groupName: g.name })));
const catById = id => allCats().find(c => c.id === id);
const catName = id => (id ? (catById(id)?.name || "—") : "");
const groupOf = id => allCats().find(c => c.id === id)?.groupName || "";
const rate = a => S.settings.rates[(acct(a)?.currency) || S.settings.currency] || 1;
const toBase = (n, a) => n * (S.settings.rates[(a?.currency) || S.settings.currency] || 1) / (S.settings.rates[S.settings.currency] || 1);

/** signed effect of a transaction on a given account */
function effect(t, accountId) {
  if (t.type === "transfer") {
    if (t.accountId === accountId) return -Math.abs(t.amount);
    if (t.transferAccountId === accountId) return Math.abs(t.amount);
    return 0;
  }
  return t.accountId === accountId ? t.amount : 0;
}
function txTouches(t, accountId) { return t.accountId === accountId || (t.type === "transfer" && t.transferAccountId === accountId); }

function balanceOf(accountId, upto) {
  const a = acct(accountId); if (!a) return 0;
  let b = a.startBalance || 0;
  for (const t of S.transactions) { if (upto && t.date > upto) continue; b += effect(t, accountId); }
  return round2(b);
}
function clearedBalanceOf(accountId) {
  let b = acct(accountId)?.startBalance || 0;
  for (const t of S.transactions) if (t.cleared) b += effect(t, accountId);
  return round2(b);
}
function balances(upto) {
  const map = {};
  S.accounts.forEach(a => map[a.id] = a.startBalance || 0);
  for (const t of S.transactions) {
    if (upto && t.date > upto) continue;
    if (t.type === "transfer") { if (map[t.accountId] !== undefined) map[t.accountId] -= Math.abs(t.amount); if (map[t.transferAccountId] !== undefined) map[t.transferAccountId] += Math.abs(t.amount); }
    else if (map[t.accountId] !== undefined) map[t.accountId] += t.amount;
  }
  Object.keys(map).forEach(k => map[k] = round2(map[k]));
  return map;
}

function snapshotFigures(upto) {
  const b = balances(upto);
  const live = S.accounts.filter(a => !a.archived);
  const bal = a => toBase(b[a.id] || 0, a);
  const totalIn = list => sum(list.map(bal));
  const checking = totalIn(live.filter(a => a.type === "checking"));
  const savings = totalIn(live.filter(a => a.type === "savings"));
  const cash = totalIn(live.filter(a => a.type === "cash"));
  const credit = totalIn(live.filter(isCredit));
  const loans = totalIn(live.filter(isLoan));
  const m = ym(upto || today());
  const flow = monthFlow(m, upto);
  const bud = budgetMonth(m);
  return {
    totalCash: checking + savings + cash, checking, savings, cash, credit, loans,
    liabilities: credit + loans,
    availableToSpend: safeToSpend().safe,
    availableToBudget: bud.readyToAssign,
    income: flow.income, spending: flow.spending, saved: monthSaved(m), surplus: flow.income - flow.spending,
  };
}

function monthFlow(m, upto) {
  let income = 0, spending = 0, savedTransfers = 0;
  for (const t of S.transactions) {
    if (ym(t.date) !== m) continue;
    if (upto && t.date > upto) continue;
    const a = acct(t.accountId);
    if (t.type === "transfer") {
      const to = acct(t.transferAccountId);
      if (to && to.type === "savings") savedTransfers += Math.abs(toBase(t.amount, a));
      continue;
    }
    const v = toBase(t.amount, a);
    if (v > 0) income += v; else spending += -v;
  }
  return { income: round2(income), spending: round2(spending), savedTransfers: round2(savedTransfers), net: round2(income - spending) };
}
// saved = transfers into savings/investments + surplus left in checking, floored at 0
function monthSaved(m) { const f = monthFlow(m); return round2(f.savedTransfers + Math.max(0, f.net)); }

/* ----- the five spending buckets ----- */
const BUCKETS = [
  { id: "housing", icon: "🏠", label: "Housing & Bills", color: "#3E6F9E" },
  { id: "food", icon: "🍔", label: "Food & Dining", color: "#0E7C6B" },

  { id: "lifestyle", icon: "🎮", label: "Entertainment & Lifestyle", color: "#B0453B" },
];
const BUCKET_OTHER = { id: "other", icon: "❓", label: "Uncategorized / other", color: "#5C7C8A" };
const bucketMeta = id => BUCKETS.find(b => b.id === id) || BUCKET_OTHER;
const BUCKET_HINTS = [
  [/rent|mortgage|hoa|property|home insur|utilit|electric|water|trash|internet|phone|cable|sewer|repair|lawn|hvac|interest|student loan|tax|charity/i, "housing"],
  [/grocer|restaurant|dining|food|coffee|snack|takeout|fast|lunch|cafe|bar |market/i, "food"],
  [/car |auto|fuel|gas station|petrol|vehicle|transit|parking|toll|rideshare|uber|lyft|registration|maintenance|repairs?$/i, "transport"],
  [/kid|child|school|clothing|apparel|haircut|salon|personal|medical|doctor|dental|pharmacy|health|fitness|gym|gift|pet|activit|daycare|baby/i, "family"],
  [/entertain|subscription|streaming|hobby|hobbies|vacation|travel|sport|going out|shopping|electronic|game|music|book/i, "lifestyle"],
];
/** which of the five buckets a category belongs to; "" = not yet mapped, "savings" = excluded */
function bucketOf(catId) {
  const c = catById(catId);
  if (!c) return "other";
  if (c.bucket) return c.bucket;
  const hay = c.name + " " + (groupOf(catId) || "");
  for (const [re, b] of BUCKET_HINTS) if (re.test(hay)) return b;
  return "other";
}
/** a bill is a fixed obligation: flagged category, matched recurring item, or tagged recurring */
function isBillTx(t) {
  if (t.type !== "expense") return false;
  const c = catById(t.categoryId);
  if (c && c.isBill) return true;
  if ((t.tags || []).includes("recurring")) return true;
  const p = (t.payee || "").trim().toLowerCase();
  if (p && S.recurring.some(r => r.active !== false && r.amount < 0 && r.payee.trim().toLowerCase() === p)) return true;
  return false;
}
const personOf = t => t.personId || acct(t.accountId)?.ownerId || null;
const personName = id => S.people.find(p => p.id === id)?.name || "Joint / household";

/** everything the Snapshot needs for one month, optionally for one person */
function monthSummary(m, personId) {
  const scope = personId === undefined ? null : personId;
  const match = t => personId === undefined ? true : personOf(t) === scope;
  let income = 0, bills = 0, spending = 0, savings = 0;
  const byBucket = {};
  [...BUCKETS, BUCKET_OTHER].forEach(b => byBucket[b.id] = 0);
  for (const t of S.transactions) {
    if (ym(t.date) !== m || !match(t)) continue;
    const a = acct(t.accountId);
    if (t.type === "transfer") {
      const to = acct(t.transferAccountId);
      if (to && to.type === "savings") savings += Math.abs(toBase(t.amount, a));
      continue;
    }
    const v = toBase(t.amount, a);
    if (v > 0) { income += v; continue; }
    const out = -v;
    const lines = (t.splits && t.splits.length) ? t.splits.map(s => ({ cat: s.categoryId, amt: Math.abs(toBase(s.amount, a)) })) : [{ cat: t.categoryId, amt: out }];
    lines.forEach(l => {
      const b = bucketOf(l.cat);
      if (b === "savings") { savings += l.amt; return; }
      byBucket[BUCKETS.some(x => x.id === b) ? b : "other"] += l.amt;
      if (isBillTx(t)) bills += l.amt; else spending += l.amt;
    });
  }
  const r = v => round2(v);
  return { income: r(income), bills: r(bills), spending: r(spending), savings: r(savings), remaining: r(income - bills - spending), byBucket, spendTotal: r(bills + spending) };
}
/** monthly plan per bucket, rolled up from the category assignments on the Budget screen */
function bucketBudgets(m) {
  const b = S.budgets[m] || {};
  const out = {};
  [...BUCKETS, BUCKET_OTHER].forEach(x => out[x.id] = 0);
  for (const id in b) {
    const k = bucketOf(id);
    if (k === "savings") continue;
    out[BUCKETS.some(x => x.id === k) ? k : "other"] += Number(b[id]) || 0;
  }
  Object.keys(out).forEach(k => out[k] = round2(out[k]));
  return out;
}
function bucketStatus(spent, budget) {
  const warn = Number(S.settings.bucketWarn) || 0.8, over = Number(S.settings.bucketOver) || 1;
  if (!budget) return { key: spent > 0 ? "none" : "ok", dot: "⚪", color: "var(--ink-3)", label: "No budget set" };
  const f = spent / budget;
  if (f >= over) return { key: "over", dot: "🔴", color: "var(--out)", label: "Over budget", frac: f };
  if (f >= warn) return { key: "warn", dot: "🟡", color: "var(--warn)", label: "Approaching budget", frac: f };
  return { key: "ok", dot: "🟢", color: "var(--in)", label: "On track", frac: f };
}
function unmappedCats(m) {
  const spent = catSpendMap(m);
  return Object.keys(spent).filter(id => spent[id] > 0 && bucketOf(id) === "other").map(id => ({ id, name: catName(id), amount: spent[id] }));
}

/* ----- category spending ----- */
function catSpendMap(m) {
  const map = {};
  for (const t of S.transactions) {
    if (ym(t.date) !== m || t.type === "transfer") continue;
    const a = acct(t.accountId); if (a && a.onBudget === false) continue;
    const add = (cid, amt) => { if (!cid) return; map[cid] = (map[cid] || 0) + (-toBase(amt, a)); };
    if (t.splits && t.splits.length) t.splits.forEach(s => add(s.categoryId, s.amount));
    else add(t.categoryId, t.amount);
  }
  Object.keys(map).forEach(k => map[k] = round2(map[k]));
  return map;
}
function firstActivityMonth() {
  let min = ymNow();
  for (const t of S.transactions) if (ym(t.date) < min) min = ym(t.date);
  for (const k in S.budgets) if (k < min) min = k;
  return min;
}
/** available balance carried into month m for each category (envelope math) */
function envelope(m) {
  const start = firstActivityMonth();
  const cats = allCats();
  const avail = {}; cats.forEach(c => avail[c.id] = 0);
  let mm = start, guard = 0;
  while (mm <= m && guard++ < 600) {
    const spent = catSpendMap(mm);
    const b = S.budgets[mm] || {};
    cats.forEach(c => {
      const carry = avail[c.id];
      const base = mm === start ? 0 : (c.rollover === "none" ? 0 : c.rollover === "positive" ? Math.max(0, carry) : carry);
      const val = round2((mm === start ? carry : base) + (Number(b[c.id]) || 0) - (spent[c.id] || 0));
      avail[c.id] = val;
    });
    if (mm === m) break;
    mm = addMonths(mm, 1);
  }
  return avail;
}
function budgetMonth(m) {
  const cats = allCats().filter(c => !c.archived);
  const spent = catSpendMap(m);
  const b = S.budgets[m] || {};
  const avail = envelope(m);
  const rows = cats.map(c => ({ ...c, budgeted: round2(Number(b[c.id]) || 0), spent: round2(spent[c.id] || 0), available: round2(avail[c.id] || 0) }));
  const assigned = round2(sum(rows.map(r => r.budgeted)));
  const spentTotal = round2(sum(rows.map(r => r.spent)));
  // on-budget cash = assets minus credit-card debt on budget
  const bal = balances(endOfMonth(m));
  const onBudgetCash = round2(sum(S.accounts.filter(a => a.onBudget !== false && !a.archived).map(a => toBase(bal[a.id] || 0, a))));
  const envelopeTotal = round2(sum(rows.map(r => r.available)));
  const readyToAssign = round2(onBudgetCash - envelopeTotal);
  return { rows, assigned, spentTotal, readyToAssign, onBudgetCash, envelopeTotal, income: monthFlow(m).income };
}

/* ----- recurring / upcoming ----- */
const FREQ = { weekly: 7, biweekly: 14, semimonthly: 15, monthly: 30, quarterly: 91, semiannual: 182, annual: 365 };
function nextOccurrence(date, freq) {
  const d = new Date(date + "T00:00:00Z");
  switch (freq) {
    case "weekly": d.setUTCDate(d.getUTCDate() + 7); break;
    case "biweekly": d.setUTCDate(d.getUTCDate() + 14); break;
    case "semimonthly": d.setUTCDate(d.getUTCDate() + 15); break;
    case "monthly": d.setUTCMonth(d.getUTCMonth() + 1); break;
    case "quarterly": d.setUTCMonth(d.getUTCMonth() + 3); break;
    case "semiannual": d.setUTCMonth(d.getUTCMonth() + 6); break;
    case "annual": d.setUTCFullYear(d.getUTCFullYear() + 1); break;
    default: d.setUTCMonth(d.getUTCMonth() + 1);
  }
  return d.toISOString().slice(0, 10);
}
function upcoming(days = 45, from = today()) {
  const end = addDays(from, days), out = [];
  for (const r of S.recurring.filter(r => r.active !== false)) {
    let d = r.next;
    let guard = 0;
    while (d < from && guard++ < 400) d = nextOccurrence(d, r.freq);
    while (d <= end && guard++ < 400) {
      if (!r.end || d <= r.end) out.push({ date: d, payee: r.payee, amount: r.amount, categoryId: r.categoryId, accountId: r.accountId, id: r.id, kind: "recurring" });
      d = nextOccurrence(d, r.freq);
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function safeToSpend() {
  const bal = balances();
  const liquid = round2(sum(S.accounts.filter(a => !a.archived && ["checking", "cash"].includes(a.type)).map(a => toBase(bal[a.id] || 0, a))));
  const evs = upcoming(30);
  const bills = evs.filter(e => e.amount < 0);
  const billTotal = round2(sum(bills.map(e => -e.amount)));
  const incomeTotal = round2(sum(evs.filter(e => e.amount > 0).map(e => e.amount)));
  const reserve = Number(S.settings.emergencyReserve) || 0;
  return { liquid, billTotal, incomeTotal, reserve, safe: round2(liquid + incomeTotal - billTotal - reserve), bills };
}
/* ----- credit card + loan payment status ----- */
function paymentsThisMonth(accountId, m) {
  const mm = m || ymNow();
  const a = acct(accountId);
  const tag = ((a && (a.paymentPayee || a.name)) || "").trim().toLowerCase();
  return round2(sum(S.transactions.filter(t => {
    if (ym(t.date) !== mm) return false;
    if (t.type === "transfer") return t.transferAccountId === accountId;
    if (t.type === "expense" && tag) return (t.payee || "").trim().toLowerCase().includes(tag) || (t.memo || "").trim().toLowerCase().includes(tag);
    return false;
  }).map(t => Math.abs(t.amount))));
}
/** 🟢 paid · 🟡 due soon · 🔴 late (with days) */
function payStatus(a, m) {
  const mm = m || ymNow();
  const due = Number(a.dueDay) || 0;
  const paid = paymentsThisMonth(a.id, mm);
  const marked = a.paidMonths && a.paidMonths.includes(mm);
  const owed = Math.abs(balanceOf(a.id));
  if (owed < 0.01) return { key: "paid", dot: "🟢", label: "PAID", color: "var(--in)", note: "Nothing owed", paid };
  if (marked || (a.minPayment && paid >= a.minPayment - 0.01) || (!a.minPayment && paid > 0))
    return { key: "paid", dot: "🟢", label: "PAID", color: "var(--in)", note: paid ? money(paid) + " paid this month" : "Marked paid", paid };
  if (!due) return { key: "due", dot: "🟡", label: "DUE SOON", color: "var(--warn)", note: "No due date set", paid };
  const day = Number(today().slice(8));
  if (day > due) {
    const late = day - due;

/* ----- insights ----- */
function detectSubscriptions() {
  const byPayee = {};
  S.transactions.filter(t => t.type === "expense" && t.amount < 0).forEach(t => {
    const k = t.payee.trim().toLowerCase(); if (!k) return;
    (byPayee[k] = byPayee[k] || []).push(t);
  });
  const out = [];
  for (const k in byPayee) {
    const list = byPayee[k].sort((a, b) => a.date.localeCompare(b.date));
    if (list.length < 2) continue;
    const months = new Set(list.map(t => ym(t.date)));
    if (months.size < 2) continue;
    const amts = list.map(t => Math.abs(t.amount));
    const avg = sum(amts) / amts.length;
    const spread = Math.max(...amts) - Math.min(...amts);
    const gaps = list.slice(1).map((t, i) => daysBetween(list[i].date, t.date));
    const avgGap = sum(gaps) / gaps.length;
    if (spread <= Math.max(2, avg * 0.12) && avgGap >= 24 && avgGap <= 40) {
      out.push({ payee: list[list.length - 1].payee, amount: round2(avg), count: list.length, last: list[list.length - 1].date, categoryId: list[list.length - 1].categoryId, cadence: "monthly" });
    } else if (spread <= Math.max(2, avg * 0.12) && avgGap >= 330 && avgGap <= 400) {
      out.push({ payee: list[list.length - 1].payee, amount: round2(avg), count: list.length, last: list[list.length - 1].date, categoryId: list[list.length - 1].categoryId, cadence: "annual" });
    }
  }
  return out.sort((a, b) => b.amount - a.amount);
}
function anomalies() {
  const m = ymNow(), out = [];
  const hist = [addMonths(m, -1), addMonths(m, -2), addMonths(m, -3)];
  const cur = catSpendMap(m);
  const past = hist.map(catSpendMap);
  const dayFrac = clamp(Number(today().slice(8)) / daysInMonth(m), 0.15, 1);
  allCats().forEach(c => {
    const avg = sum(past.map(p => p[c.id] || 0)) / past.length;
    const now = cur[c.id] || 0;
    if (avg < 25) return;
    const projected = now / dayFrac;
    if (projected > avg * 1.3 && now > 40) out.push({ kind: "category", name: c.name, now, avg: round2(avg), delta: (projected - avg) / avg, projected: round2(projected) });
  });
  const payeeTot = (mm) => { const o = {}; S.transactions.filter(t => ym(t.date) === mm && t.amount < 0 && t.type === "expense").forEach(t => o[t.payee] = (o[t.payee] || 0) + -t.amount); return o; };
  const pc = payeeTot(m), pp = hist.map(payeeTot);
  Object.keys(pc).forEach(p => {
    const avg = sum(pp.map(x => x[p] || 0)) / pp.length;
    if (avg > 60 && pc[p] > avg * 1.5) out.push({ kind: "payee", name: p, now: round2(pc[p]), avg: round2(avg), delta: (pc[p] - avg) / avg });
  });
  return out.sort((a, b) => b.delta - a.delta).slice(0, 10);
}
function healthScore() {
  const f = snapshotFigures();
  const months = [addMonths(ymNow(), -3), addMonths(ymNow(), -2), addMonths(ymNow(), -1)];
  const avgSpend = sum(months.map(m => monthFlow(m).spending)) / 3 || 1;
  const avgIncome = sum(months.map(m => monthFlow(m).income)) / 3 || 1;
  const efMonths = f.totalCash / avgSpend;
  const emergency = clamp(efMonths / 6, 0, 1);
  const debtRatio = avgIncome ? Math.abs(f.credit + f.loans) / (avgIncome * 12) : 1;
  const debt = clamp(1 - debtRatio / 2.5, 0, 1);
  const savingsRate = clamp((sum(months.map(monthSaved)) / 3) / avgIncome, 0, 1);
  const savings = clamp(savingsRate / 0.2, 0, 1);
  const b = budgetMonth(ymNow());
  const over = b.rows.filter(r => r.available < 0).length;
  const adherence = clamp(1 - over / Math.max(6, b.rows.filter(r => r.budgeted > 0).length), 0, 1);
  const cash = clamp((avgIncome - avgSpend) / Math.max(1, avgIncome) / 0.15, 0, 1);
  const parts = [
    { k: "Emergency fund", v: emergency, note: `${efMonths.toFixed(1)} months of expenses on hand` },
    { k: "Debt load", v: debt, note: `${money(Math.abs(f.credit + f.loans))} owed` },
    { k: "Savings rate", v: savings, note: pct(savingsRate, 1) + " of income saved" },
    { k: "Budget adherence", v: adherence, note: `${over} categories overspent this month` },
    { k: "Cash flow", v: cash, note: money(avgIncome - avgSpend) + "/mo average surplus" },
  ];
  const score = Math.round(sum(parts.map(p => p.v)) / parts.length * 100);
  return { score, parts, avgSpend, avgIncome, savingsRate, efMonths };
}
function recommendations() {
  const out = [], h = healthScore(), f = snapshotFigures();
  const subs = detectSubscriptions();
  const subTotal = sum(subs.filter(s => s.cadence === "monthly").map(s => s.amount));
  if (subTotal > 0) out.push(`Subscriptions run ${money(subTotal)}/month — ${money(subTotal * 12)} a year. Cancelling the bottom third would free about ${money(subTotal * 0.33 * 12)} annually.`);
  const rest = catSpendMap(addMonths(ymNow(), -1));
  const restCat = allCats().find(c => c.name === "Restaurants");
  if (restCat && rest[restCat.id] > 100) out.push(`Trimming restaurant spending 15% would save about ${money(rest[restCat.id] * 0.15 * 12)} a year.`);
  if (h.efMonths < 3) out.push(`Your cash covers ${h.efMonths.toFixed(1)} months of spending. Reaching 3 months takes another ${money(Math.max(0, h.avgSpend * 3 - f.totalCash))}.`);
  const cards = S.accounts.filter(a => a.type === "credit" && !a.archived);
  const bal = balances();
  cards.forEach(a => { const u = a.creditLimit ? Math.abs(bal[a.id]) / a.creditLimit : 0; if (u > 0.3) out.push(`${a.name} is at ${pct(u)} utilization. Paying it under 30% (${money(Math.abs(bal[a.id]) - a.creditLimit * 0.3)}) usually helps your score.`); });
  const debts = S.accounts.filter(a => isLiability(a) && !a.archived && Math.abs(bal[a.id]) > 0);
  if (debts.length) { const hi = debts.sort((a, b) => (b.apr || 0) - (a.apr || 0))[0]; if (hi.apr) out.push(`${hi.name} carries the highest rate at ${hi.apr}%. Every extra dollar sent there beats every other debt payment.`); }
  const b = budgetMonth(ymNow());
  if (b.readyToAssign > 0) out.push(`${money(b.readyToAssign)} is sitting unassigned. Give it a job before the month ends.`);
  if (b.readyToAssign < 0) out.push(`You've assigned ${money(-b.readyToAssign)} more than you have. Pull it back from a category with room.`);
  return out;
}

/* ----- rules ----- */
function matchesRule(t, r) {
  const test = c => {
    const val = c.field === "amount" ? Math.abs(t.amount) : c.field === "account" ? (acct(t.accountId)?.name || "") : String(t[c.field] ?? "");
    const v = String(c.value ?? "");
    if (v === "") return false;
    switch (c.op) {
      case "contains": return val.toLowerCase().includes(v.toLowerCase());
      case "notcontains": return !val.toLowerCase().includes(v.toLowerCase());
      case "is": return val.toLowerCase() === v.toLowerCase();
      case "starts": return val.toLowerCase().startsWith(v.toLowerCase());
      case "ends": return val.toLowerCase().endsWith(v.toLowerCase());
      case "regex": try { return new RegExp(v, "i").test(val); } catch (e) { return false; }
      case ">": return Number(val) > Number(v);
      case "<": return Number(val) < Number(v);
      case "between": { const [a, b] = v.split(",").map(Number); return Number(val) >= a && Number(val) <= b; }
      default: return false;
    }
  };
  return r.match === "any" ? r.conditions.some(test) : r.conditions.every(test);
}
function applyRules(t, ruleList) {
  const rules = (ruleList || S.rules).filter(r => r.active !== false);
  let changed = false;
  for (const r of rules) {
    if (!matchesRule(t, r)) continue;
    const A = r.actions || {};
    if (A.categoryId) { t.categoryId = A.categoryId; changed = true; }
    if (A.payee) { t.payee = A.payee; changed = true; }
    if (A.memo) { t.memo = A.memo; changed = true; }
    if (A.tag) { t.tags = Array.from(new Set([...(t.tags || []), A.tag])); changed = true; }
    if (A.markReviewed) { t.reviewed = true; changed = true; }
  }
  return changed;
}

/* ============================================================
   TINY SVG CHART KIT
   ============================================================ */
function svgLine(points, opt = {}) {
  const w = opt.w || 600, h = opt.h || 120, pad = opt.pad ?? 4;
  if (!points.length) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const vals = points.map(p => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (opt.zero) min = Math.min(0, min);
  if (max === min) { max += 1; min -= 1; }
  const X = i => pad + (i * (w - pad * 2)) / Math.max(1, points.length - 1);
  const Y = v => h - pad - ((v - min) / (max - min)) * (h - pad * 2);
  const d = points.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join("");
  const area = `${d}L${X(points.length - 1).toFixed(1)},${h - pad}L${X(0).toFixed(1)},${h - pad}Z`;
  const col = opt.color || "var(--brass)";
  const zeroY = min < 0 && max > 0 ? Y(0) : null;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    ${opt.fill !== false ? `<path d="${area}" fill="${col}" opacity=".10"/>` : ""}
    ${zeroY !== null ? `<line x1="0" x2="${w}" y1="${zeroY}" y2="${zeroY}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3"/>` : ""}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="${opt.sw || 2}" stroke-linejoin="round" stroke-linecap="round"/>
    ${opt.dot !== false ? `<circle cx="${X(points.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="3.2" fill="${col}"/>` : ""}
  </svg>`;
}
function svgBars(items, opt = {}) {
  const h = opt.h || 150, w = opt.w || 600, pad = 18, n = items.length || 1;
  const max = Math.max(1, ...items.map(i => Math.abs(i.value)));
  const bw = (w - pad) / n;
  return `<svg viewBox="0 0 ${w} ${h + 18}" style="width:100%;height:${h + 18}px;display:block">
  ${items.map((it, i) => {
    const bh = (Math.abs(it.value) / max) * (h - 8);
    const x = pad / 2 + i * bw, y = h - bh;
    return `<rect x="${x + bw * 0.18}" y="${y}" width="${bw * 0.64}" height="${Math.max(1, bh)}" rx="3" fill="${it.color || opt.color || "var(--brass)"}" opacity="${it.dim ? .45 : 1}"><title>${esc(it.label)}: ${money(it.value)}</title></rect>
    <text x="${x + bw / 2}" y="${h + 12}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">${esc(it.label)}</text>`;
  }).join("")}</svg>`;
}
function svgGroupedBars(groups, opt = {}) {
  const h = opt.h || 160, w = opt.w || 600, pad = 20, n = groups.length || 1;
  const max = Math.max(1, ...groups.flatMap(g => g.values.map(Math.abs)));
  const gw = (w - pad) / n, colors = opt.colors || ["var(--in)", "var(--out)"];
  return `<svg viewBox="0 0 ${w} ${h + 18}" style="width:100%;height:${h + 18}px;display:block">
  ${groups.map((g, i) => g.values.map((v, j) => {
    const bh = (Math.abs(v) / max) * (h - 10), bw = (gw * 0.7) / g.values.length;
    const x = pad / 2 + i * gw + gw * 0.15 + j * bw;
    return `<rect x="${x}" y="${h - bh}" width="${bw * 0.86}" height="${Math.max(1, bh)}" rx="2.5" fill="${colors[j]}"><title>${esc(g.label)} — ${money(v)}</title></rect>`;
  }).join("") + `<text x="${pad / 2 + i * gw + gw / 2}" y="${h + 12}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">${esc(g.label)}</text>`).join("")}</svg>`;
}
const PALETTE = ["#A9762A", "#0E7C6B", "#B0453B", "#3E6F9E", "#7A5EA8", "#C08A2E", "#4C8C4A", "#B5657E", "#5C7C8A", "#8A6100", "#2F6F6F", "#96513F"];
function svgDonut(items, opt = {}) {
  const size = opt.size || 180, r = size / 2 - 6, cx = size / 2, cy = size / 2, sw = opt.sw || 26;
  const total = sum(items.map(i => i.value)) || 1;
  let ang = -Math.PI / 2;
  const arcs = items.map((it, i) => {
    const frac = it.value / total, a2 = ang + frac * Math.PI * 2;
    const large = frac > 0.5 ? 1 : 0;
    const p = (a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
    const d = `M${p(ang)}A${r},${r} 0 ${large} 1 ${p(a2)}`;
    ang = a2;
    return `<path d="${d}" fill="none" stroke="${it.color || PALETTE[i % PALETTE.length]}" stroke-width="${sw}"><title>${esc(it.label)}: ${money(it.value)} (${pct(frac, 1)})</title></path>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:none">${arcs}
   ${opt.center ? `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="15" font-family="var(--mono)" font-weight="600" fill="var(--ink)">${esc(opt.center)}</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="9" fill="var(--ink-3)">${esc(opt.centerSub || "")}</text>` : ""}</svg>`;
}
function progressBar(frac, color) {
  return `<div class="bar"><i style="width:${clamp(frac, 0, 1) * 100}%;background:${color || "var(--brass)"}"></i></div>`;
}

    </section>

    <div class="panel" style="border-color:var(--out)"><div class="panel-b flexrow" style="padding:10px 16px">
      <span style="font-size:15px">🔴</span>
      <b>Needs attention</b>
      <span class="muted">${[sum.remaining < 0 ? `Spending is ${money(-sum.remaining)} past income this month` : "",
        ...BUCKETS.filter(b => bucketStatus(sum.byBucket[b.id] || 0, budgets[b.id] || 0).key === "over").map(b => `${b.label} is ${money((sum.byBucket[b.id] || 0) - budgets[b.id])} over`)].filter(Boolean).join(" · ")}</span>
    </div></div>` : ""}

    <div class="panel"><div class="panel-h"><h3>Spending breakdown</h3><span style="flex:1"></span>
      <span class="muted" style="font-size:12px">everyone combined · bills included</span></div>
      <div class="panel-b flexrow" style="gap:28px;align-items:flex-start">
        ${donut}
        <div style="flex:1;min-width:240px">
          ${slices.map(b => {
            const share = donutTotal ? b.value / donutTotal : 0;
            return `<div style="margin-bottom:9px">
              <div class="flexrow" style="justify-content:space-between;font-size:13px">
                <span><span class="dot" style="background:${b.color}"></span> ${b.icon} ${b.label}${b.id === "other" ? (unmapped.length ? ` <button class="btn ghost sm" data-mapcats="1">sort ${unmapped.length} categor${unmapped.length === 1 ? "y" : "ies"}</button>` : ` <button class="btn ghost sm" data-review="1">categorize</button>`) : ""}</span>
                <span><b class="num">${money(b.value)}</b> <span class="muted num" style="font-size:11.5px">${pct(share, 1)}</span></span>
              </div>
              ${progressBar(share, b.color)}</div>`;
          }).join("")}
        </div>
        <div style="width:190px;border-left:1px solid var(--rule-2);padding-left:18px">
          ${[["Total income", sum.income, "pos"], ["Total bills", sum.bills, ""], ["Total spending", sum.spending, ""], ["Total savings", sum.savings, "pos"]].map(([k, v, c]) =>
            `<div class="flexrow" style="justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span class="muted">${k}</span><b class="num ${c}">${money(v)}</b></div>`).join("")}
          <div class="hairline" style="margin:8px 0"></div>
          <div class="flexrow" style="justify-content:space-between"><span class="eyebrow">Remaining</span><b class="num ${sum.remaining < 0 ? "neg" : "pos"}" style="font-size:16px">${money(sum.remaining)}</b></div>
        </div>
      </div></div>

    <div class="panel"><div class="panel-h"><h3>Budget status</h3><span style="flex:1"></span>
      <span class="muted" style="font-size:12px">🟢 under ${pct(S.settings.bucketWarn ?? .8)} · 🟡 ${pct(S.settings.bucketWarn ?? .8)}–${pct(S.settings.bucketOver ?? 1)} · 🔴 over</span>
      <button class="btn sm ghost" data-go="budget">Edit budgets</button></div>
      <div class="panel-b" style="padding:0"><table>
        <tr><th>Category</th><th class="r">Spent</th><th class="r">Budget</th><th class="r">Remaining</th><th class="r">Used</th><th>Progress</th><th></th></tr>
        ${BUCKETS.map(statusRow).join("")}
        ${slices.find(x => x.id === "other" && x.value > 0) ? statusRow(BUCKET_OTHER) : ""}
        <tr><td><b>All categories</b></td><td class="r num"><b>${money(sum.spendTotal)}</b></td>
          <td class="r num"><b>${money(BUCKETS.reduce((a, b) => a + (budgets[b.id] || 0), 0))}</b></td>
          <td class="r num"><b>${money(BUCKETS.reduce((a, b) => a + (budgets[b.id] || 0), 0) - sum.spendTotal)}</b></td><td colspan="3"></td></tr>
      </table></div></div>

    <div class="panel"><div class="panel-h"><h3>People</h3><span style="flex:1"></span>
      <button class="btn sm ghost" data-go="settings">Manage people</button></div>
      <div class="panel-b">
      ${cards.length ? `<div class="grid ${cards.length > 2 ? "g3" : "g2"}">${cards.map(c => `
        <div class="panel" style="box-shadow:none;border-top:3px solid ${c.color}"><div class="panel-b">
          <div class="flexrow" style="margin-bottom:10px"><span class="dot" style="width:10px;height:10px;background:${c.color}"></span><b style="font-size:15px;color:${c.color}">${esc(c.name)}</b></div>
          <div class="flexrow" style="justify-content:space-between;font-size:13px;margin-bottom:5px"><span class="muted">Income</span><b class="num pos">${money(c.s.income)}</b></div>
          <div class="flexrow" style="justify-content:space-between;font-size:13px;margin-bottom:5px"><span class="muted">Bills</span><b class="num">${money(c.s.bills)}</b></div>
          <div class="flexrow" style="justify-content:space-between;font-size:13px;margin-bottom:5px"><span class="muted">Spending</span><b class="num">${money(c.s.spending)}</b></div>
          <div class="flexrow" style="justify-content:space-between;font-size:13px"><span class="muted">Savings</span><b class="num pos">${money(c.s.savings)}</b></div>
          <div class="hairline" style="margin:10px 0"></div>
          ${!c.pid && c.s.income === 0
      ? `<div class="flexrow" style="justify-content:space-between"><span class="eyebrow">Shared costs</span>
            <b class="num" style="font-size:20px">${money(c.s.bills + c.s.spending)}</b></div>
          <div class="muted" style="font-size:11px;margin-top:2px">Paid from shared accounts, not charged to anyone yet</div>`
      : `<div class="flexrow" style="justify-content:space-between"><span class="eyebrow">Remaining</span>
            <b class="num" style="font-size:20px;color:${c.s.remaining < 0 ? "var(--out)" : "var(--brass)"}">${money(c.s.remaining)}</b></div>`}
        </div></div>`).join("")}</div>`
      : `<div class="empty"><b>No people set up yet</b>Add each person, then assign their accounts, so everyone sees their own income, bills, and spending.
        <div style="margin-top:12px"><button class="btn primary" data-newperson="1">Add a person</button></div></div>`}
      </div></div>
  </div>`;
}

/* ============================================================
   2. TODAY
   ============================================================ */
function viewToday() {
  const s = safeToSpend();
  const evs = upcoming(14);
  const bal = balances();
  const byDay = {};
  evs.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  const recent = S.transactions.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  const unreviewed = S.transactions.filter(t => !t.reviewed).length;
  return `<div class="stack">
    <div class="grid g3">
      <div class="panel"><div class="panel-b">
        <span class="eyebrow">Available cash</span>
        <div class="num" style="font-size:38px;font-weight:600;letter-spacing:-.04em;margin:4px 0">${money(s.liquid)}</div>
        <div class="muted">Checking and cash, right now</div></div></div>
      <div class="panel" style="border-color:var(--brass)"><div class="panel-b">
        <span class="eyebrow">Safe to spend</span>
        <div class="num" style="font-size:38px;font-weight:600;letter-spacing:-.04em;margin:4px 0;color:var(--brass)">${money(s.safe)}</div>
        <div class="muted">After ${money(s.billTotal)} of bills, ${money(s.incomeTotal)} of income, and a ${money(s.reserve)} reserve</div></div></div>
      <div class="panel"><div class="panel-b">
        <span class="eyebrow">Bills in the next 30 days</span>
        <div class="num" style="font-size:38px;font-weight:600;letter-spacing:-.04em;margin:4px 0">${money(s.billTotal)}</div>
        <div class="muted">${s.bills.length} scheduled payment${s.bills.length === 1 ? "" : "s"}</div></div></div>
    </div>
    ${unreviewed ? `<div class="panel" style="border-color:var(--brass)"><div class="panel-b flexrow"><b>${unreviewed} transaction${unreviewed > 1 ? "s" : ""} need${unreviewed > 1 ? "" : "s"} a category.</b><span style="flex:1"></span><button class="btn brass sm" data-review="1">Review now</button></div></div>` : ""}
    <div class="grid g2">
      <div class="panel"><div class="panel-h"><h3>Next 14 days</h3><span style="flex:1"></span><button class="btn sm ghost" data-go="bills">Calendar</button></div><div class="panel-b">
        ${Object.keys(byDay).length ? `<div class="tl">
          <div class="ev today"><b class="num" style="width:64px">Today</b><span>Balance ${money(s.liquid)}</span></div>
          ${Object.keys(byDay).sort().map(d => byDay[d].map(e => `<div class="ev ${e.amount > 0 ? "pos" : "neg"}"><b class="num muted" style="width:64px">${fmtDateShort(d)}</b><span style="flex:1">${esc(e.payee)}</span><span class="num ${e.amount > 0 ? "pos" : "neg"}">${money(e.amount, { plus: true })}</span></div>`).join("")).join("")}
        </div>` : `<div class="empty"><b>Clear ahead</b>No scheduled money movement in the next two weeks.</div>`}
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Latest activity</h3><span style="flex:1"></span><button class="btn sm ghost" data-go="transactions">All transactions</button></div>
        <div class="panel-b" style="padding-top:4px"><table>
        ${recent.map(t => `<tr class="clickable" data-edittx="${t.id}"><td class="num muted" style="width:62px">${fmtDateShort(t.date)}</td><td>${esc(t.payee)}</td>
          <td class="muted">${t.type === "transfer" ? "Transfer" : esc(catName(t.categoryId)) || `<span class="badge b">needs category</span>`}</td>
          <td class="r num ${t.amount > 0 && t.type !== "transfer" ? "pos" : ""}">${t.type === "transfer" ? money(-Math.abs(t.amount)) : money(t.amount, { plus: true })}</td></tr>`).join("")}
        </table></div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Account balances</h3><span style="flex:1"></span><button class="btn sm ghost" data-go="accounts">All accounts</button></div><div class="panel-b" style="padding-top:4px"><table>
      ${S.accounts.filter(a => !a.archived && !a.hidden).map(a => `<tr class="clickable" data-account="${a.id}"><td>${atype(a.type).icon} ${esc(a.name)}</td><td class="muted">${atype(a.type).label}</td><td class="r num ${bal[a.id] < 0 ? "neg" : ""}">${money(bal[a.id], { cur: a.currency })}</td></tr>`).join("")}
    </table></div></div>
  </div>`;
}

/* ============================================================
   3. ACCOUNTS
   ============================================================ */
function viewAccounts() {
  const bal = balances();
  $("#topActions").innerHTML = `<button class="btn brass" data-newaccount="1">+ Add account</button>`;
  const owner = a => a.ownerId
    ? `<span class="pdot" style="background:${personColor(a.ownerId)}"></span> ${esc(personName(a.ownerId))}`
    : `<span class="pdot" style="background:var(--ink-3)"></span> Joint / household`;
  const srcBadge = a => a.source === "tiller"
    ? `<span class="badge g" title="Synced from your Tiller export">🔗 Tiller</span>`
    : `<span class="badge" title="You keep this one up to date">✏️ Manual</span>`;
  const syncBlock = a => a.source !== "tiller" ? "" : `<div class="hairline" style="margin:10px 0"></div>
    <div class="flexrow" style="justify-content:space-between;font-size:12px"><span class="muted">🔗 Connected via Tiller</span><span class="pos">🟢 Connected</span></div>
    <div class="flexrow" style="justify-content:space-between;font-size:12px"><span class="muted">Last synced</span><span class="num">${a.tillerSynced ? new Date(a.tillerSynced).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</span></div>
    <div class="flexrow" style="margin-top:8px"><button class="btn sm" data-syncnow="${a.id}">🔄 Sync now</button>
      <button class="btn sm ghost" data-editaccount="${a.id}">⚙️ Settings</button>
      <button class="btn sm ghost danger" data-disconnect="${a.id}">🔌 Disconnect</button></div>`;
  const live = cls => S.accounts.filter(a => !a.archived && acctClass(a) === cls);

  /* ---------- 🏦 bank ---------- */
  const banks = live("bank");
  const bankRows = banks.map(a => {
    const b = bal[a.id] || 0;
    const goal = a.type === "savings" && a.savingsGoal ? Number(a.savingsGoal) : 0;
    return `<tr class="clickable">
      <td data-account="${a.id}"><b>${atype(a.type).icon} ${esc(a.name)}</b>${a.nickname ? ` <span class="muted">${esc(a.nickname)}</span>` : ""} ${srcBadge(a)}
        ${goal ? `<div style="max-width:220px;margin-top:5px">${progressBar(b / goal, "var(--in)")}
          <span class="muted" style="font-size:10.5px">${money(b, { dp: 0 })} of ${money(goal, { dp: 0 })} savings goal · ${pct(b / goal)}</span></div>` : ""}</td>
      <td class="muted">${atype(a.type).label}</td>
      <td>${owner(a)}</td>
      <td class="r num ${b < 0 ? "neg" : ""}"><b>${money(b, { cur: a.currency })}</b></td>
      <td class="r" style="font-size:12px">${a.source === "tiller"
      ? `<span class="pos">🟢 Connected</span><div class="muted num" style="font-size:11px">${a.tillerSynced ? "Last synced " + new Date(a.tillerSynced).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</div>`
      : `<span class="muted num">${lastUpdated(a) ? fmtDate(lastUpdated(a)) : "—"}</span>`}</td>
      <td class="r">${a.source === "tiller"
      ? `<button class="btn sm ghost" data-syncnow="${a.id}" title="Sync now">🔄</button><button class="btn sm ghost" data-editaccount="${a.id}" title="Account settings">⚙️</button><button class="btn sm ghost" data-disconnect="${a.id}" title="Disconnect">🔌</button><button class="btn sm ghost" data-account="${a.id}">Ledger</button>`
      : `<button class="btn sm ghost" data-account="${a.id}">Ledger</button><button class="btn sm ghost" data-reconcile="${a.id}">Reconcile</button><button class="btn sm ghost" data-editaccount="${a.id}">Edit</button>`}</td></tr>`;
  }).join("");

  /* ---------- 💳 credit ---------- */
  const cards = live("credit");
  const cardCards = cards.map(a => {
    const owed = Math.abs(bal[a.id] || 0), limit = Number(a.creditLimit) || 0;
    const util = limit ? owed / limit : 0;
    const st = payStatus(a);
    return `<div class="panel" style="box-shadow:none"><div class="panel-b">
      <div class="flexrow" style="margin-bottom:8px"><span style="font-size:18px">${atype(a.type).icon}</span>
        <div style="flex:1"><b>${esc(a.name)}</b> ${srcBadge(a)}<div class="muted" style="font-size:11.5px">${atype(a.type).label} · ${owner(a)}${a.institution ? " · " + esc(a.institution) : ""}</div></div>
        <span class="badge" style="border-color:${st.color};color:${st.color}">${st.dot} ${st.label}</span></div>
      <div class="flexrow" style="justify-content:space-between;align-items:flex-end">
        <div><span class="eyebrow">Owed</span><div class="num" style="font-size:24px;font-weight:600">${money(owed)}</div></div>
        <div style="text-align:right"><span class="eyebrow">Available credit</span><div class="num" style="font-size:16px">${money(Math.max(0, limit - owed))}</div></div></div>
      <div style="margin:10px 0 4px">${progressBar(util, util > .3 ? "var(--out)" : "var(--in)")}</div>
      <div class="flexrow" style="justify-content:space-between"><span class="muted" style="font-size:11.5px">${pct(util)} utilization</span><span class="muted" style="font-size:11.5px">limit ${money(limit, { dp: 0 })}</span></div>
      <div class="hairline" style="margin:10px 0"></div>
      <table><tr><td class="muted">Minimum payment</td><td class="r num">${money(a.minPayment || 0)}</td></tr>
        <tr><td class="muted">Due date</td><td class="r num">${dueDateLabel(a)}</td></tr>
        <tr><td class="muted">APR</td><td class="r num">${a.apr ? a.apr.toFixed(2) + "%" : "—"}</td></tr>
        <tr><td class="muted">Status</td><td class="r" style="color:${st.color}">${esc(st.note)}</td></tr>
        ${a.lastPayment ? `<tr><td class="muted">Last payment</td><td class="r num">${fmtDate(a.lastPayment)}</td></tr>` : ""}</table>
      <div class="flexrow" style="margin-top:10px">
        ${st.key === "paid" ? `<button class="btn sm ghost" data-unmarkpaid="${a.id}">Undo paid</button>` : `<button class="btn sm" data-markpaid="${a.id}">Mark paid</button>`}
        <button class="btn sm ghost" data-account="${a.id}">Ledger</button><button class="btn sm ghost" data-editaccount="${a.id}">Edit</button></div>
      ${syncBlock(a)}
    </div></div>`;
  }).join("");

  /* ---------- 🏠 loans ---------- */
  const loans = live("loan");
  const loanCards = loans.map(a => {
    const owed = Math.abs(bal[a.id] || 0), orig = Number(a.originalBalance) || 0;
    const paidOff = orig ? 1 - owed / orig : 0;
    const st = payStatus(a);
    const left = remainingTerm(a);
    return `<div class="panel" style="box-shadow:none"><div class="panel-b">
      <div class="flexrow" style="margin-bottom:8px"><span style="font-size:18px">${atype(a.type).icon}</span>
        <div style="flex:1"><b>${esc(a.name)}</b> ${srcBadge(a)}<div class="muted" style="font-size:11.5px">${atype(a.type).label} · ${owner(a)}</div></div>
        <span class="badge" style="border-color:${st.color};color:${st.color}">${st.dot} ${st.label}</span></div>
      <div class="flexrow" style="justify-content:space-between;align-items:flex-end">
        <div><span class="eyebrow">Remaining</span><div class="num" style="font-size:24px;font-weight:600">${money(owed)}</div></div>
        <div style="text-align:right"><span class="eyebrow">Original</span><div class="num" style="font-size:16px">${money(orig || 0)}</div></div></div>
      ${orig ? `<div style="margin:10px 0 4px">${progressBar(paidOff, "var(--in)")}</div>
        <span class="muted" style="font-size:11.5px">${pct(paidOff)} paid off</span>` : ""}
      <div class="hairline" style="margin:10px 0"></div>
      <table><tr><td class="muted">Payment</td><td class="r num">${money(a.minPayment || 0)}/mo</td></tr>
        <tr><td class="muted">APR</td><td class="r num">${a.apr ? a.apr.toFixed(2) + "%" : "—"}</td></tr>
        <tr><td class="muted">Due date</td><td class="r num">${dueDateLabel(a)}</td></tr>
        <tr><td class="muted">Term</td><td class="r num">${a.term ? a.term + " months" : "—"}</td></tr>
        <tr><td class="muted">Remaining term</td><td class="r num">${left && left < 1200 ? left + " months" : "—"}</td></tr>
        <tr><td class="muted">Status</td><td class="r" style="color:${st.color}">${esc(st.note)}</td></tr></table>
      <div class="flexrow" style="margin-top:10px">
        ${st.key === "paid" ? `<button class="btn sm ghost" data-unmarkpaid="${a.id}">Undo paid</button>` : `<button class="btn sm" data-markpaid="${a.id}">Mark paid</button>`}
        <button class="btn sm ghost" data-account="${a.id}">Ledger</button><button class="btn sm ghost" data-editaccount="${a.id}">Edit</button></div>
      ${syncBlock(a)}
    </div></div>`;
  }).join("");

  const totalCash = sum(banks.map(a => toBase(bal[a.id] || 0, a)));
  const totalOwed = Math.abs(sum([...cards, ...loans].map(a => toBase(bal[a.id] || 0, a))));
  const attention = [...cards, ...loans].filter(a => payStatus(a).key === "late");

  const section = (icon, title, sub, body, empty) => `<div class="panel"><div class="panel-h">
    <h3>${icon} ${title}</h3><span style="flex:1"></span><span class="muted">${sub}</span></div>
    ${body ? `<div class="panel-b" ${title === "Bank Accounts" ? 'style="padding:0"' : ""}>${body}</div>` : `<div class="empty">${empty}</div>`}</div>`;

  return `<div class="stack">
    ${attention.length ? `<div class="panel" style="border-color:var(--out)"><div class="panel-b flexrow" style="padding:10px 16px">
      <span style="font-size:15px">🔴</span><b>Late payment${attention.length > 1 ? "s" : ""}</b>
      <span class="muted">${attention.map(a => `${esc(a.name)} — ${payStatus(a).label.toLowerCase()}`).join(" · ")}</span></div></div>` : ""}
    <div class="grid g3">
      <div class="panel"><div class="panel-b kpi"><span class="eyebrow">Money in the bank</span><v class="pos">${money(totalCash)}</v><span class="muted">${banks.length} account${banks.length === 1 ? "" : "s"}</span></div></div>
      <div class="panel"><div class="panel-b kpi"><span class="eyebrow">Total owed</span><v class="neg">${money(totalOwed)}</v><span class="muted">${cards.length} credit · ${loans.length} loans</span></div></div>
      <div class="panel"><div class="panel-b kpi"><span class="eyebrow">Due this month</span><v>${money(sum([...cards, ...loans].map(a => Number(a.minPayment) || 0)))}</v><span class="muted">minimum payments</span></div></div>
    </div>

    ${section("🏦", "Bank Accounts", money(totalCash), banks.length ? `<table>
      <tr><th>Account</th><th>Type</th><th>Owner</th><th class="r">Available balance</th><th class="r">Last updated</th><th></th></tr>${bankRows}</table>` : "",
    `<b>No bank accounts yet</b>Add a checking or savings account.<div style="margin-top:12px"><button class="btn primary" data-newaccount="1">+ Add account</button></div>`)}

    ${section("💳", "Credit Accounts", cards.length ? `${money(Math.abs(sum(cards.map(a => bal[a.id] || 0))))} owed` : "", cards.length ? `<div class="grid g2">${cardCards}</div>` : "",
    `<b>No credit accounts</b>Add a credit card or line of credit to track utilization and due dates.`)}

    ${section("🏠", "Loans & Financing", loans.length ? `${money(Math.abs(sum(loans.map(a => bal[a.id] || 0))))} remaining` : "", loans.length ? `<div class="grid g2">${loanCards}</div>` : "",
    `<b>No loans</b>Add an auto loan, student loan, mortgage, or other financing.`)}

    ${S.accounts.filter(a => a.archived).length ? `<div class="panel"><div class="panel-h"><h3>Archived</h3></div><div class="panel-b"><table>
      ${S.accounts.filter(a => a.archived).map(a => `<tr><td>${esc(a.name)}</td><td class="muted">${atype(a.type).label}</td><td class="r num">${money(bal[a.id])}</td><td class="r"><button class="btn sm ghost" data-editaccount="${a.id}">Restore</button></td></tr>`).join("")}
    </table></div></div>` : ""}
    ${S.reconciliations.length ? `<div class="panel"><div class="panel-h"><h3>Reconciliation history</h3></div><div class="panel-b"><table>
      <tr><th>Date</th><th>Account</th><th class="r">Statement</th><th class="r">Difference</th><th>Note</th></tr>

function filteredTx() {
  const F = UI.txFilters;
  const terms = F.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = S.transactions.filter(t => {
    if (F.account && !txTouches(t, F.account)) return false;
    if (F.category) { const inSplit = t.splits && t.splits.some(s => s.categoryId === F.category); if (t.categoryId !== F.category && !inSplit) return false; }
    if (F.type && t.type !== F.type) return false;
    if (F.cleared === "y" && !t.cleared) return false;
    if (F.cleared === "n" && t.cleared) return false;
    if (F.cleared === "r" && !t.reconciled) return false;
    if (F.cleared === "u" && t.reviewed) return false;
    if (F.from && t.date < F.from) return false;
    if (F.to && t.date > F.to) return false;
    if (F.tag && !(t.tags || []).includes(F.tag)) return false;
    if (F.minAmt !== "" && Math.abs(t.amount) < Number(F.minAmt)) return false;
    if (F.maxAmt !== "" && Math.abs(t.amount) > Number(F.maxAmt)) return false;
    if (terms.length) {
      const hay = [t.payee, t.memo, catName(t.categoryId), groupOf(t.categoryId), acct(t.accountId)?.name, (t.tags || []).join(" "), String(Math.abs(t.amount)), t.date, t.checkNo].join(" ").toLowerCase();
      if (!terms.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const k = UI.txSort.key, d = UI.txSort.dir;
  list.sort((a, b) => {
    let x, y;
    if (k === "amount") { x = a.amount; y = b.amount; }
    else if (k === "account") { x = acct(a.accountId)?.name || ""; y = acct(b.accountId)?.name || ""; }
    else if (k === "category") { x = catName(a.categoryId); y = catName(b.categoryId); }
    else { x = a[k] ?? ""; y = b[k] ?? ""; }
    return (x > y ? 1 : x < y ? -1 : (a.date > b.date ? 1 : -1)) * d;
  });
  return list;
}

function goalMonthly(g) {
  if (!g.targetDate) return g.monthly || 0;
  const months = Math.max(1, Math.ceil(daysBetween(today(), g.targetDate) / 30.4));
  return round2(Math.max(0, (g.target - g.saved) / months));
}

function amortize(balance, apr, payment, extra = 0) {
  let b = Math.abs(balance), months = 0, interest = 0;
  const r = (apr || 0) / 100 / 12;
  const pay = payment + extra;
  if (pay <= b * r) return { months: Infinity, interest: Infinity };
  while (b > 0.01 && months < 1200) { const i = b * r; interest += i; b = b + i - pay; months++; }
  return { months, interest: round2(interest) };
}
function viewDebt() {
  const bal = balances();
  const debts = S.accounts.filter(a => isLiability(a) && !a.archived).map(a => ({ ...a, bal: Math.abs(bal[a.id] || 0) })).filter(d => d.bal > 0);
  const total = sum(debts.map(d => d.bal));
  const minTotal = sum(debts.map(d => d.minPayment || 0));
  const extra = Number(UI.debtExtra) || 0;
  const order = debts.slice().sort((a, b) => UI.debtMethod === "snowball" ? a.bal - b.bal : (b.apr || 0) - (a.apr || 0));
  // simulate payoff with snowball/avalanche
  function simulate(extraPay) {
    let accts = order.map(d => ({ name: d.name, bal: d.bal, apr: d.apr || 0, min: d.minPayment || Math.max(25, d.bal * 0.02) }));
    let months = 0, interest = 0, freed = 0, payoff = {};
    while (accts.some(a => a.bal > 0.01) && months < 600) {
      months++;
      let pool = extraPay + freed;
      accts.forEach(a => { if (a.bal <= 0.01) return; const i = a.bal * a.apr / 100 / 12; interest += i; a.bal += i; const p = Math.min(a.bal, a.min); a.bal -= p; });
      for (const a of accts) { if (a.bal <= 0.01 || pool <= 0) continue; const p = Math.min(a.bal, pool); a.bal -= p; pool -= p; }
      accts.forEach(a => { if (a.bal <= 0.01 && !payoff[a.name]) { payoff[a.name] = months; freed += a.min; a.bal = 0; } });
    }
    return { months, interest: round2(interest), payoff };
  }
  const base = debts.length ? simulate(0) : { months: 0, interest: 0, payoff: {} };
  const withExtra = debts.length ? simulate(extra) : base;
  const payoffDate = n => { const d = new Date(); d.setUTCMonth(d.getUTCMonth() + n); return d.toLocaleDateString(undefined, { month: "short", year: "numeric", timeZone: "UTC" }); };

      <div class="panel"><div class="panel-b kpi"><span class="eyebrow">Debt-free (minimums)</span><v>${base.months >= 600 ? "—" : payoffDate(base.months)}</v><span class="muted">${base.months >= 600 ? "never at this rate" : base.months + " months"}</span></div></div>
      <div class="panel"><div class="panel-b kpi"><span class="eyebrow">Interest on that path</span><v class="neg">${money(base.interest)}</v><span class="muted">total cost</span></div></div>
    </div>

      <div class="panel-b" style="padding:0"><table>
      <tr><th>#</th><th>Account</th><th class="r">Balance</th><th class="r">APR</th><th class="r">Minimum</th><th class="r">Due</th><th class="r">Paid off</th><th style="width:20%">Paid down</th></tr>
      ${order.map((d, i) => {
    const paid = d.originalBalance ? 1 - d.bal / d.originalBalance : 0;
    return `<tr><td class="num muted">${i + 1}</td><td><b>${esc(d.name)}</b> <span class="muted">${atype(d.type).label}</span></td>

  }).join("")}
      ${debts.length ? "" : `<tr><td colspan="8"><div class="empty"><b>No debt tracked</b>Nothing owed, or add a credit card or loan account.</div></td></tr>`}
      </table></div></div>

        <p class="muted" style="font-size:12px;margin-bottom:0">Card payments recorded as transfers move debt, not spending — they never show up as an expense twice.</p>`;
    })()}
      </div></div>
    </div>
  </div>`;
}

          <tr><td class="muted">Biggest category</td><td class="r">${(() => { const map = {}; yearMonths.forEach(m => { const s = catSpendMap(m); for (const k in s) map[k] = (map[k] || 0) + s[k]; }); const top = Object.entries(map).sort((a, b) => b[1] - a[1])[0]; return top ? `${esc(catName(top[0]))} <span class="num">${money(top[1])}</span>` : "—"; })()}</td></tr>

function buildAlerts() {
  const out = [], b = budgetMonth(ymNow()), s = safeToSpend();
  b.rows.filter(r => r.budgeted > 0).forEach(r => {
    const frac = r.spent / r.budgeted;
    if (r.available < 0) out.push({ icon: "🚨", title: `${r.name} is overspent`, body: `${money(-r.available)} past the plan. Cover it from another category.`, go: "budget" });
    else if (frac >= .9) out.push({ icon: "⚠️", title: `${r.name} is at ${pct(frac)} of budget`, body: `${money(r.available)} left for the rest of the month.`, go: "budget" });
  });
  upcoming(Number(S.settings.alerts?.billDays ?? 3)).filter(e => e.amount < 0).forEach(e => out.push({ icon: "📅", title: `${e.payee} due ${fmtDate(e.date)}`, body: `${money(-e.amount)} scheduled from ${acct(e.accountId)?.name || "an account"}.`, go: "bills" }));
  const lowThresh = Number(S.settings.alerts?.lowBalance ?? 300);
  if (s.liquid - s.billTotal < lowThresh) out.push({ icon: "⚠️", title: "Cash is getting tight", body: `${money(s.liquid)} on hand with ${money(s.billTotal)} of bills due in the next 30 days.`, go: "bills" });
  S.goals.forEach(g => { const need = goalMonthly(g); if (g.target && g.saved >= g.target) out.push({ icon: "🎉", title: `${g.name} is fully funded`, body: `${money(g.saved)} saved.`, go: "goals" }); else if (g.targetDate && need > (g.monthly || 0) && g.monthly) out.push({ icon: "🎯", title: `${g.name} is behind pace`, body: `Needs ${money(need)}/month to land on ${fmtDate(g.targetDate)}.`, go: "goals" }); });
  S.accounts.filter(a => !a.archived && isLiability(a)).forEach(a => {
    const st = payStatus(a);
    if (st.key === "late") out.push({ icon: "🔴", title: `${a.name} payment is ${st.label.toLowerCase()}`, body: st.note, go: "accounts" });
    else if (st.key === "due" && st.days !== undefined && st.days <= 5) out.push({ icon: "🟡", title: `${a.name} payment due soon`, body: st.note, go: "accounts" });
  });
  const unrev = S.transactions.filter(t => !t.reviewed).length;
  if (unrev) out.push({ icon: "🔄", title: `${unrev} transactions need review`, body: "Categorize them so the budget stays accurate.", go: "transactions" });
  return out.slice(0, 12);
}

let modalStack = [];
function modal({ title, body, footer, wide, onMount }) {
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(title)}</h2><span style="flex:1"></span><button class="btn ghost" data-close="1">✕</button></div>
    <div class="modal-b">${body}</div>
    ${footer === null ? "" : `<div class="modal-f">${footer || `<button class="btn" data-close="1">Close</button>`}</div>`}
  </div>`;
  el.addEventListener("mousedown", e => { if (e.target === el) closeModal(); });
  el.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  $("#modalRoot").appendChild(el);
  modalStack.push(el);
  if (onMount) onMount(el);
  const first = el.querySelector("input,select,textarea"); if (first) setTimeout(() => first.focus(), 30);
  return el;
}
function closeModal() { const el = modalStack.pop(); if (el) el.remove(); }
function closeAllModals() { modalStack.forEach(e => e.remove()); modalStack = []; }
function confirmDialog(title, msg, onYes, danger) {
  modal({
    title, body: `<p style="margin:0">${esc(msg)}</p>`,
    footer: `<button class="btn" data-close="1">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="yes">Yes, do it</button>`,
    onMount: el => el.querySelector("#yes").onclick = () => { closeModal(); onYes(); }
  });
}
const catOptions = (sel) => S.groups.map(g => `<optgroup label="${esc(g.name)}">${g.cats.filter(c => !c.archived).map(c => `<option value="${c.id}" ${sel === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("");
const acctOptions = (sel, filter) => S.accounts.filter(a => !a.archived && (!filter || filter(a))).map(a => `<option value="${a.id}" ${sel === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("");

const INCOME_SOURCES = ["Check", "Cash", "Loan"];
/** the catch-all category for one of the five headline buckets, created on demand */
function mainCatId(bucket) {
  const found = allCats().find(c => c.main === bucket) || allCats().find(c => c.bucket === bucket && c.name === bucketMeta(bucket).label);
  if (found) return found.id;
  const meta = bucketMeta(bucket);
  let g = S.groups.find(x => x.name === "Main categories");
  if (!g) { g = { id: uid(), name: "Main categories", cats: [] }; S.groups.push(g); }
  const c = { id: uid(), name: meta.label, bucket, main: bucket, isBill: bucket === "housing", rollover: "positive", archived: false, icon: "", color: "" };
  g.cats.push(c);
  return c.id;
}
